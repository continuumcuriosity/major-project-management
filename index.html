<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Field Log</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --bg: #13141b;
  --bg-panel: #1b1d27;
  --bg-panel-raised: #22242f;
  --line: #33364399;
  --paper: #ede6d6;
  --ink: #e8e5db;
  --ink-dim: #9a9baa;
  --ink-faint: #62647a;
  --amber: #c9a24b;
  --amber-dim: #c9a24b33;
  --radius: 3px;
  --serif: 'Newsreader', Georgia, serif;
  --sans: 'Inter', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'Courier New', monospace;

}

html[data-theme="light"]{
  --bg: #f4efe4;
  --bg-panel: #fbf8f0;
  --bg-panel-raised: #ffffff;
  --line: #d8cfba;
  --paper: #3a3428;
  --ink: #33301f;
  --ink-dim: #6b6552;
  --ink-faint: #9a9480;
  --amber: #a37c1f;
  --amber-dim: #a37c1f22;
}

*{box-sizing:border-box; margin:0; padding:0;}
body{
  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% 8%, #ffffff05 0%, transparent 40%),
    radial-gradient(circle at 85% 60%, #ffffff04 0%, transparent 45%);
  color: var(--ink);
  font-family: var(--sans);
  min-height: 100vh;
  padding: 40px 20px 80px;
}
::selection{ background: var(--amber-dim); color: var(--ink); }
:focus-visible{ outline: 1.5px solid var(--amber); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }

.wrap{ max-width: 760px; margin: 0 auto; }
.theme-footer{ display:flex; justify-content:center; padding: 30px 0 10px; }
.theme-toggle-btn{
  background: var(--bg-panel-raised); border:1px solid var(--line); color: var(--ink-dim);
  font-family: var(--mono); font-size:11px; letter-spacing:.06em; padding:6px 16px; border-radius:20px; cursor:pointer;
}
.theme-toggle-btn:hover{ color: var(--amber); border-color: var(--amber); }

/* setup screen */
.setup{
  max-width: 560px; margin: 80px auto; background: var(--bg-panel);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 28px;
}
.setup h2{ font-family: var(--serif); font-size: 22px; margin-bottom: 12px; color: var(--paper); }
.setup p{ font-size: 13.5px; color: var(--ink-dim); line-height: 1.6; margin-bottom: 10px; }
.setup code{ background: var(--bg-panel-raised); padding: 2px 6px; border-radius: 3px; font-family: var(--mono); font-size: 12.5px; color: var(--amber); }
.setup ol{ padding-left: 20px; font-size: 13.5px; color: var(--ink-dim); line-height: 1.9; }

header{
  display:flex; justify-content: space-between; align-items: flex-end;
  border-bottom: 1px solid var(--line);
  padding-bottom: 20px; margin-bottom: 28px; flex-wrap: wrap; gap: 14px;
}
.title-block .eyebrow{
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--amber); margin-bottom: 8px;
}
h1{ font-family: var(--serif); font-weight: 500; font-size: 30px; letter-spacing: -0.01em; color: var(--ink); }
.subtitle{ font-size: 13px; color: var(--ink-dim); margin-top: 4px; }
.stats{ display:flex; gap: 22px; font-family: var(--mono); }
.stat{ text-align: right; }
.stat-warn .num{ color: #a35a3a; }
.stat .num{ font-size: 19px; color: var(--paper); display:block; }
.stat .label{ font-size: 9.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.1em; }

.composer{ background: var(--bg-panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 32px; overflow: hidden; }
.type-tabs{ display:flex; border-bottom: 1px solid var(--line); }
.type-tab{
  flex:1; background:none; border:none; color: var(--ink-faint);
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 12px 8px; cursor:pointer;
  border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
}
.type-tab:hover{ color: var(--ink-dim); }
.type-tab.active{ color: var(--paper); border-bottom-color: var(--amber); }

.composer-body{ padding: 18px 18px 16px; display:none; }
.composer-body.active{ display:block; }

.field-row{ display:flex; gap:10px; margin-bottom: 10px; flex-wrap: wrap; }
.field{ flex:1; min-width: 140px; display:flex; flex-direction: column; gap:5px; }
.field label{ font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); }
input, textarea, select{
  background: var(--bg-panel-raised); border: 1px solid var(--line); border-radius: var(--radius);
  color: var(--ink); font-family: var(--sans); font-size: 13.5px; padding: 9px 10px; width: 100%;
}
textarea{ resize: vertical; min-height: 54px; line-height: 1.5; }
input::placeholder, textarea::placeholder{ color: var(--ink-faint); }
select{ cursor: pointer; }

.composer-footer{ display:flex; justify-content: flex-end; align-items:center; gap: 10px; margin-top: 8px; }
.btn-add{
  background: var(--amber); color: #1a1508; border:none; border-radius: var(--radius);
  font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 9px 18px; cursor:pointer; font-weight: 600;
}
.btn-add:hover{ filter: brightness(1.08); }
.btn-add:disabled{ opacity: .5; cursor: default; }
.save-msg{ font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.save-msg.err{ color: #c17a5c; }

.filter-bar{ display:flex; align-items:center; gap:8px; margin-bottom: 18px; font-family: var(--mono); font-size: 11px; flex-wrap: wrap; row-gap: 8px; }
.filter-bar .flabel{ color: var(--ink-faint); text-transform: uppercase; letter-spacing: .08em; margin-right: 4px;}
.chip{
  background: none; border: 1px solid var(--line); color: var(--ink-dim);
  border-radius: 20px; padding: 4px 12px; cursor: pointer; text-transform: uppercase; letter-spacing: .05em;
}
.chip.active{ border-color: var(--amber); color: var(--amber); }

.day-group{ margin-bottom: 20px; }
.day-heading{
  font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
  letter-spacing: 0.1em; text-transform: uppercase; display:flex; align-items:center; gap:10px; margin-bottom: 12px;
  cursor: pointer;
}
.month-group{ margin-bottom: 8px; }
.month-heading{
  font-family: var(--mono); font-size: 12px; color: var(--amber);
  letter-spacing: 0.12em; text-transform: uppercase; display:flex; align-items:center; gap:10px;
  margin: 26px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--amber-dim);
  cursor: pointer;
}
.month-group:first-child .month-heading{ margin-top: 0; }
.group-count{
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-faint); background: var(--bg-panel-raised);
  border-radius: 20px; padding: 1px 8px; margin-left: auto;
}
.month-heading .group-count{ color: #8a7635; background: #c9a24b22; }
.week-heading{
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim);
  letter-spacing: 0.08em; text-transform: uppercase; display:flex; align-items:center; gap:10px;
  margin: 16px 0 12px; cursor: pointer;
}
.week-heading .chevron{ color: var(--ink-faint); }
.milestone-divider{
  display:flex; align-items:center; gap:14px; margin: 30px 0 10px; cursor:pointer;
}
.milestone-divider:first-child{ margin-top: 0; }
.milestone-divider .line{ flex:1; height:1px; background: var(--amber-dim); }
.milestone-divider .chevron{ color: var(--amber); }
.milestone-divider-label{
  font-family: var(--mono); font-size: 11px; letter-spacing:.08em; text-transform:uppercase; color: var(--amber);
  white-space:nowrap;
}

.card{
  background: var(--bg-panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 16px 12px; margin-bottom: 8px; position: relative;
}
.entry-row{ display:flex; align-items:flex-start; gap:10px; cursor:pointer; }
.entry-row-main{ flex:1; min-width:0; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.entry-row-title{ font-family: var(--serif); font-size: 14.5px; line-height:1.35; color:var(--ink); }
.entry-row-meta{ font-family: var(--mono); font-size: 10px; color:var(--ink-dim); white-space:nowrap; }
.entry-row-actions{ display:flex; gap:2px; flex-shrink:0; }
.chevron{ font-family: var(--mono); font-size: 10px; color:var(--ink-faint); flex-shrink:0; width:12px; text-align:center; margin-top:3px; user-select:none; }
.entry-row .chevron{ color: var(--ink-faint); }
.entry-detail{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
.expand-controls{ display:flex; gap:12px; margin-left:auto; }
.expand-controls button{
  background:none; border:none; color: var(--ink-faint); font-family: var(--mono); font-size:10.5px;
  letter-spacing:.05em; text-transform:uppercase; cursor:pointer; text-decoration: underline dotted;
}
.expand-controls button:hover{ color: var(--amber); }
.verdict-filter-bar{ margin-top:-8px; margin-bottom:18px; padding-left:2px; }
.verdict-filter-bar .chip{ font-size:10px; padding:3px 10px; }
.verdict-filter-chips{ display:flex; gap:6px; flex-wrap:wrap; }
.verdict-filter-chips .chip{ font-size:10px; padding:3px 10px; }
.verdict-filter-chips .chip[data-value="all"].active{ border-color: var(--amber); color: var(--amber); }
.card-top{ display:flex; justify-content: space-between; align-items:flex-start; margin-bottom: 8px; gap: 10px;}
.stamp{ font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; padding: 2px 7px; border-radius: 2px; text-transform: uppercase; border: 1px solid currentColor; }
.stamp.session{ color: #4a5b8a; }
.stamp.paper-accepted{ color: #4f7043; }
.stamp.paper-rejected{ color: #8a4a35; }
.stamp.paper-maybe{ color: #8a7635; }
.stamp.paper-alternate{ color: #4a5b8a; }
.cal-link{ display:inline-block; margin-top:8px; font-family: var(--mono); font-size: 10.5px; letter-spacing:.04em; color:#4a5b8a; text-decoration:none; border-bottom:1px dashed #4a5b8a88; }
.cal-link:hover{ color:#33436b; }
.cal-link.cal-added{ color:#4f7043; border-bottom-color:#4f704388; }
.cal-link.cal-btn{ background:none; border:none; padding:0; font-family: var(--mono); font-size:10.5px; letter-spacing:.04em; cursor:pointer; }
.meta-info{ font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin-top: 5px; line-height: 1.5; }
.verdict-toggle{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.verdict-chip{ background:none; font-family: var(--mono); }
.verdict-chip[data-value="accepted"].active{ border-color:#4f7043; color:#4f7043; }
.verdict-chip[data-value="rejected"].active{ border-color:#8a4a35; color:#8a4a35; }
.verdict-chip[data-value="maybe"].active{ border-color:#8a7635; color:#8a7635; }
.verdict-chip[data-value="alternate"].active{ border-color:#4a5b8a; color:#4a5b8a; }
.verdict-chip[data-value="related-work"].active{ border-color:#6b6656; color:#6b6656; }
.card.verdict-accepted{ border-left: 3px solid #4f7043; }
.card.verdict-rejected{ border-left: 3px solid #8a4a35; }
.card.verdict-maybe{ border-left: 3px solid #8a7635; }
.card.verdict-alternate{ border-left: 3px solid #4a5b8a; }
.card.verdict-related-work{ border-left: 3px solid #6b6656; }
.tag-dot{ color:var(--ink-faint); font-size:10px; margin: 0 1px; }
.resolved-text{ text-decoration: line-through; color:var(--ink-faint); }
.title-link{ color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
.title-link:hover{ color: #4a5b8a; text-decoration-color: #4a5b8a; }
.link-suggest{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center; }
.link-suggest:empty{ margin-top:0; }
.link-suggest-label{ font-family: var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color: var(--ink-faint); }
.link-suggest-chip{
  background: var(--bg-panel-raised); border: 1px dashed var(--amber-dim); color: var(--ink-dim);
  font-family: var(--sans); font-size: 11px; padding: 3px 10px; border-radius: 20px; cursor: pointer;
}
.link-suggest-chip:hover{ border-color: var(--amber); color: var(--amber); }
.link-suggest-chip.active{ border-style: solid; border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }
.downstream-block{ margin-top:10px; }
.downstream-block .k{ display:block; font-family: var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color: var(--ink-faint); margin-bottom:4px; }
.linked-jump{
  margin-top: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim);
  cursor: pointer; text-decoration: underline dotted;
}
.linked-jump:hover{ color: #4a5b8a; }
.tag-filter-banner{
  display:flex; align-items:center; gap:10px; background: var(--bg-panel); border:1px solid var(--amber-dim);
  border-radius: var(--radius); padding:10px 14px; margin-bottom:18px; font-family: var(--mono); font-size:11.5px; color: var(--ink-dim);
}
.tag-filter-banner button{ margin-left:auto; background:none; border:none; color: var(--amber); cursor:pointer; font-family: var(--mono); font-size:11px; text-transform:uppercase; }
.milestone-toggle-row{ margin-bottom: 10px; }
.milestone-check{
  display:flex; align-items:center; gap:8px; font-family: var(--mono); font-size: 11px;
  color: var(--ink-dim); cursor: pointer; letter-spacing: .03em;
}
.milestone-check input{ width:auto; accent-color: var(--amber); cursor:pointer; }
.stamp.milestone{ color:#8a6d1a; border-color:#8a6d1a; }
.milestone-toggle{
  position: fixed; left: 18px; top: calc(50% + 54px); transform: translateY(-50%);
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg-panel-raised); border: 1px solid var(--line); color: var(--amber);
  font-family: var(--mono); font-size: 15px; cursor: pointer; z-index: 40;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 4px 14px -6px #00000088;
}
.milestone-toggle:hover{ border-color: var(--amber); }
.milestone-panel{
  position: fixed; left: 70px; top: calc(50% + 54px); transform: translateY(-50%);
  width: 280px; max-height: 60vh; background: var(--bg-panel); border: 1px solid var(--line);
  border-radius: var(--radius); z-index: 41; box-shadow: 0 10px 30px -10px #000000aa;
  opacity:0; pointer-events:none; transition: opacity .15s;
  display:flex; flex-direction:column;
}
.milestone-panel.open{ opacity:1; pointer-events:auto; }
#milestone-list{ overflow-y:auto; padding: 8px 10px; }
.milestone-item{ display:flex; align-items:baseline; gap:8px; padding:8px 6px; border-radius:3px; cursor:pointer; }
.milestone-item:hover{ background: var(--bg-panel-raised); }
.milestone-item .m-star{ color: var(--amber); flex-shrink:0; }
.milestone-item .m-text{ font-size:12.5px; line-height:1.4; color: var(--ink); flex:1; }
.milestone-item .m-date{ display:block; font-family: var(--mono); font-size:9.5px; color: var(--ink-faint); margin-top:2px; }
.milestone-empty{ padding: 20px 10px; text-align:center; color: var(--ink-faint); font-size:12px; }
.flash-highlight{ animation: flashHighlight 1.5s ease; }
@keyframes flashHighlight{
  0%{ box-shadow: 0 0 0 3px var(--amber); }
  100%{ box-shadow: none; }
}

.todo-toggle{
  position: fixed; left: 18px; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg-panel-raised); border: 1px solid var(--line); color: var(--amber);
  font-family: var(--mono); font-size: 15px; cursor: pointer; z-index: 40;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 4px 14px -6px #00000088;
}
.todo-toggle:hover{ border-color: var(--amber); }
.todo-badge{
  position:absolute; top:-4px; right:-4px; background: var(--amber); color:#1a1508;
  font-family: var(--mono); font-size: 9px; font-weight:700; border-radius:50%;
  width:16px; height:16px; display:flex; align-items:center; justify-content:center;
}
.todo-panel{
  position: fixed; left: 70px; top: 50%; transform: translateY(-50%);
  width: 280px; max-height: 60vh; background: var(--bg-panel); border: 1px solid var(--line);
  border-radius: var(--radius); z-index: 41; box-shadow: 0 10px 30px -10px #000000aa;
  opacity:0; pointer-events:none; transition: opacity .15s;
  display:flex; flex-direction:column;
}
.todo-panel.open{ opacity:1; pointer-events:auto; }
.todo-header{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); font-family: var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color: var(--ink-dim); flex-shrink:0; }
.todo-close{ background:none; border:none; color: var(--ink-faint); font-size:16px; cursor:pointer; }
#todo-list{ overflow-y:auto; padding: 8px 10px; }
.todo-item{ display:flex; gap:8px; align-items:flex-start; padding:8px 6px; border-radius:3px; }
.todo-item:hover{ background: var(--bg-panel-raised); }
.todo-check{
  width:14px; height:14px; min-width:14px; margin-top:2px; border:1.5px solid var(--ink-faint); border-radius:3px;
  cursor:pointer; background:none; display:inline-flex; align-items:center; justify-content:center; padding:0;
  color:#1a1508; font-size:10px; line-height:1;
}
.todo-check.checked{ background: var(--amber); border-color: var(--amber); }
.todo-text{ font-size:12.5px; line-height:1.4; color: var(--ink); flex:1; }
.todo-text .date{ display:block; font-family: var(--mono); font-size:9.5px; color: var(--ink-faint); margin-bottom:2px; }
.todo-text.done{ text-decoration: line-through; color: var(--ink-faint); }
.todo-empty{ padding: 20px 10px; text-align:center; color: var(--ink-faint); font-size:12px; }
.todo-divider{ font-family: var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color: var(--ink-faint); padding: 10px 6px 6px; border-top:1px solid var(--line); margin-top:6px; }

.graph-toggle{
  position: fixed; right: 18px; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg-panel-raised); border: 1px solid var(--line); color: var(--amber);
  font-family: var(--mono); font-size: 16px; cursor: pointer; z-index: 40;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 4px 14px -6px #00000088;
}
.graph-toggle:hover{ border-color: var(--amber); }
.graph-modal{
  position: fixed; inset:0; background: #00000099; z-index: 60;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition: opacity .15s;
}
.graph-modal.open{ opacity:1; pointer-events:auto; }
.graph-modal-inner{
  width: min(920px, 94vw); height: min(640px, 86vh); background: var(--bg-panel);
  border:1px solid var(--line); border-radius: var(--radius); display:flex; flex-direction:column; overflow:hidden;
}
.graph-header{ display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim); flex-wrap:wrap; row-gap:8px; }
.graph-legend{ display:flex; gap:12px; margin-left:auto; font-size:10px; text-transform:none; letter-spacing:0; flex-wrap:wrap; color: var(--ink-faint); }
.graph-legend span{ display:flex; align-items:center; gap:5px; }
.graph-legend .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
.graph-close{ background:none; border:none; color:var(--ink-faint); font-size:18px; cursor:pointer; line-height:1; }
.graph-close:hover{ color: var(--amber); }
#graph-svg-wrap{ flex:1; position:relative; }
#graph-svg{ width:100%; height:100%; cursor: grab; display:block; }
#graph-svg:active{ cursor: grabbing; }
.graph-node circle{ stroke: var(--bg-panel); stroke-width:2px; cursor:pointer; }
.graph-node text{ font-family: var(--mono); font-size:9px; fill: var(--ink-dim); pointer-events:none; }
.graph-node:hover circle{ stroke: var(--amber); }
.graph-link{ stroke: var(--line); stroke-width:1.5px; }
.graph-empty{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-family:var(--sans); font-size:13px; text-align:center; padding:20px;}
.recap-toggle{
  position: fixed; right: 18px; top: calc(50% + 54px); transform: translateY(-50%);
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg-panel-raised); border: 1px solid var(--line); color: var(--amber);
  font-family: var(--mono); font-size: 15px; cursor: pointer; z-index: 40;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 4px 14px -6px #00000088;
}
.recap-toggle:hover{ border-color: var(--amber); }
.recap-modal{
  position: fixed; inset:0; background: #00000099; z-index: 60;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition: opacity .15s;
}
.recap-modal.open{ opacity:1; pointer-events:auto; }
.recap-modal-inner{
  width: min(640px, 94vw); height: min(680px, 88vh); background: var(--bg-panel);
  border:1px solid var(--line); border-radius: var(--radius); display:flex; flex-direction:column; overflow:hidden;
}
.recap-header{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim); flex-wrap:wrap; }
.recap-header select{ font-family:var(--sans); font-size:12.5px; padding:5px 8px; }
.recap-close{ background:none; border:none; color:var(--ink-faint); font-size:18px; cursor:pointer; margin-left:auto; }
.recap-close:hover{ color: var(--amber); }
.recap-range-row{ display:flex; align-items:center; gap:8px; padding: 0 16px 12px; flex-wrap:wrap; }
.recap-range-row select{ font-family:var(--sans); font-size:12.5px; padding:5px 8px; flex:1; min-width:120px; }
#recap-list{ flex:1; overflow-y:auto; padding: 10px 16px; }
.recap-day{ font-family: var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color: var(--ink-faint); margin: 18px 0 8px; }
.recap-day:first-child{ margin-top:0; }
.recap-entry{ padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.recap-entry:hover .recap-entry-title{ color: var(--amber); }
.recap-entry-top{ display:flex; align-items:baseline; gap:8px; }
.recap-entry-type{
  font-family: var(--mono); font-size: 9px; text-transform:uppercase; letter-spacing:.06em;
  color: var(--ink-faint); background: var(--bg-panel-raised); padding:1px 7px; border-radius:20px; flex-shrink:0;
}
.recap-entry-title{ font-size:13.5px; color: var(--ink); line-height:1.4; }
.recap-entry-detail{ margin-top:6px; padding-left:2px; }
.recap-entry-line{ font-size:12px; color: var(--ink-dim); line-height:1.6; margin-bottom:3px; }
.recap-entry-line:last-child{ margin-bottom:0; }
.recap-actions{ display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); flex-shrink:0; }
.recap-actions button{ flex:1; }
.recap-type-row{
  display:flex; gap:14px; padding: 10px 16px; border-bottom: 1px solid var(--line);
  font-family: var(--mono); font-size: 11px; color: var(--ink-dim); flex-shrink:0; flex-wrap:wrap;
}
.recap-type-row label{ display:flex; align-items:center; gap:5px; cursor:pointer; }
.recap-type-row input{ accent-color: var(--amber); cursor:pointer; }
.recap-ai-panel{ border-top:1px solid var(--line); padding: 14px 16px; flex-shrink:0; max-height: 240px; overflow-y:auto; }
.recap-ai-loading{ font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }
.recap-ai-error{ font-family: var(--mono); font-size: 11.5px; color: #c17a5c; }
.recap-ai-text{ font-family: var(--sans); font-size: 13.5px; line-height: 1.6; color: var(--ink); }
#summarize-backend{ font-family: var(--sans); font-size: 12px; padding: 5px 8px; }
.recap-empty{ padding:30px 10px; text-align:center; color: var(--ink-faint); font-size:13px; }
@media (max-width: 700px){
  .recap-toggle{ right: 10px; }
}
@media (max-width: 700px){
  .graph-toggle{ right: 10px; }
}
@media (max-width: 700px){
  .todo-toggle{ left: 10px; }
  .todo-panel{ left: 58px; width: calc(100vw - 76px); }
  .milestone-toggle{ left: 10px; }
  .milestone-panel{ left: 58px; width: calc(100vw - 76px); }
}
@media (max-width: 640px){
  body{ padding: 24px 12px 70px; }
  .wrap{ max-width: 100%; }
  h1{ font-size: 23px; }
  .stats{ gap: 12px; }
  .stat .num{ font-size: 16px; }
  .expand-controls{ margin-left: 0; width: 100%; justify-content: flex-end; }
  .month-heading, .day-heading{ font-size: 10px; }
  .card{ padding: 10px 12px 10px; }
  .entry-row-title{ font-size: 13.5px; }
  .composer-body{ padding: 14px 14px 12px; }
  .setup{ margin: 40px auto; padding: 20px; }
}
@media (max-width: 420px){
  .type-tab{ font-size: 9.5px; padding: 10px 4px; }
  .field{ min-width: 100%; }
  .entry-row{ gap: 6px; }
  .entry-row-actions button{ font-size: 13px; }
  h1{ font-size: 20px; }
  .stats{ width: 100%; justify-content: space-between; gap: 6px; }
  .stat .num{ font-size: 14.5px; }
  .stat .label{ font-size: 8.5px; }
}
.stamp.decision{ color: #6b4a8a; }
.stamp.account{ color: #3d6b73; }
.stamp.outcome-holding{ color: #4f7043; }
.stamp.outcome-revisited{ color: #8a7635; }
.stamp.outcome-reversed{ color: #8a4a35; }
.stamp.outcome-superseded{ color: #6b6656; }
.warn-note{ font-size: 11.5px; color: var(--ink-faint); margin-top: -4px; margin-bottom: 10px; line-height: 1.5; }
.card-meta{ font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); }
.card-title{ font-family: var(--serif); font-size: 16.5px; font-weight: 500; margin-bottom: 5px; line-height: 1.3; color: var(--ink);}
.card-link{ font-size: 11.5px; color: var(--ink-dim); text-decoration: none; word-break: break-all; }
.card-link:hover{ text-decoration: underline; }
.card-body{ font-size: 13.5px; line-height: 1.55; color: var(--ink-dim); margin-top: 6px; }
.card-body + .card-body{ margin-top: 10px; }
.card-body .k{ font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); display:block; margin-bottom: 2px;}
.tags{ margin-top: 10px; display:flex; gap:6px; flex-wrap:wrap; }
.tag{ font-family: var(--mono); font-size: 10px; background: var(--bg-panel-raised); padding: 2px 7px; border-radius: 20px; color: var(--ink-dim); cursor: pointer; }
.tag:hover{ background: var(--amber-dim); color: var(--amber); }
.delete-btn{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size: 15px; line-height: 1; padding: 2px 4px; }
.delete-btn:hover{ color:#8a4a35; }

.empty-state{ text-align:center; padding: 60px 20px; color: var(--ink-faint); }
.empty-state .glyph{ font-family: var(--serif); font-size: 34px; color: var(--ink-faint); margin-bottom: 10px; }
.empty-state p{ font-size: 13px; max-width: 340px; margin: 0 auto; line-height: 1.6; }
.loading{ text-align:center; padding: 60px 20px; color: var(--ink-faint); font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;}
.error-banner{ background:#c17a5c22; border:1px solid #c17a5c66; color:#e8b39c; padding:12px 16px; border-radius: var(--radius); font-size: 13px; margin-bottom: 20px; font-family: var(--mono); }

async function tryFetchPaperMetadata(link){
  const infoEl = document.getElementById('p-meta-info');
  if(!link){ infoEl.textContent = ''; return; }

  const doiMatch = link.match(/10\.\d{4,9}\/[^\s"'<>]+/);
  if(doiMatch){
    await fetchFromCrossref(doiMatch[0].replace(/[.,)]+$/, ''), infoEl);
    return;
  }

  infoEl.textContent = 'Looking up page details…';
  try{
    const res = await fetch(`/api/fetch-meta?url=${encodeURIComponent(link)}`);
    const json = await res.json();
    if(json.ok && json.title){
      if(!$('#p-title').value.trim()) $('#p-title').value = json.title;
      if(json.description && !$('#p-reason').value.trim()) $('#p-reason').value = json.description.slice(0, 300);
      let line = `Found: ${json.title}`;
      if(json.authors && json.authors.length) line += ` — ${json.authors[0]}${json.authors.length > 1 ? ' et al.' : ''}`;
      if(json.year) line += `, ${json.year}`;
      infoEl.textContent = line;
    } else {
      infoEl.textContent = json.error ? `Could not auto-extract (${json.error})` : 'Could not auto-extract details — enter manually.';
    }
  } catch(err){
    infoEl.textContent = 'Auto-lookup unavailable — enter details manually.';
  }
}

async function fetchFromCrossref(doi, infoEl){
  infoEl.textContent = 'Looking up metadata…';
  try{
    const res = await fetch(`https://api.crossref.org/works/${encodeURIComponent(doi)}`);
    if(!res.ok) throw new Error('not found');
    const json = await res.json();
    const item = json.message;
    const title = item.title && item.title[0];
    const authors = (item.author || []).map(a => a.family).filter(Boolean);
    const year = (item['published-print'] || item['published-online'] || item.created || {})['date-parts']?.[0]?.[0];
    if(title){
      if(!$('#p-title').value.trim()) $('#p-title').value = title;
      if(item['container-title'] && item['container-title'][0] && !$('#p-reason').value.trim()){
        $('#p-reason').value = `Published in ${item['container-title'][0]}${year ? ' (' + year + ')' : ''}.`;
      }
      infoEl.textContent = `Found via CrossRef: ${title}${authors.length ? ' — ' + authors[0] + (authors.length > 1 ? ' et al.' : '') : ''}${year ? ', ' + year : ''}`;
    } else {
      infoEl.textContent = '';
    }
  } catch(err){
    infoEl.textContent = 'No DOI metadata found — enter details manually.';
  }
}

function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

const NON_TITLES = new Set(['(no summary)', '(untitled)', '(untitled decision)', '']);

function scanForLinkMentions(text, prefix, excludeId){
  const box = document.getElementById(prefix + '-link-suggest');
  if(!box) return;
  const trimmed = (text || '').trim();
  if(trimmed.length < 4){ box.innerHTML = ''; return; }
  const lower = trimmed.toLowerCase();
  const matches = entries
    .filter(e => e.id !== excludeId)
    .map(e => ({ e, title: entryRowTitle(e) }))
    .filter(({ title }) => !NON_TITLES.has(title) && title.length >= 4 && lower.includes(title.toLowerCase()))
    .slice(0, 3);

  if(matches.length === 0){ box.innerHTML = ''; return; }

  const currentValue = document.getElementById(prefix + '-linked').value;
  box.innerHTML = `<span class="link-suggest-label">Mentioned:</span>` + matches.map(({ e, title }) => {
    const short = title.length > 28 ? title.slice(0, 26) + '…' : title;
    const active = e.id === currentValue ? ' active' : '';
    return `<button type="button" class="link-suggest-chip${active}" data-id="${e.id}">${escapeHtml(short)} → link</button>`;
  }).join('');

  box.querySelectorAll('.link-suggest-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const select = document.getElementById(prefix + '-linked');
      select.value = (select.value === btn.dataset.id) ? '' : btn.dataset.id;
      box.querySelectorAll('.link-suggest-chip').forEach(b => b.classList.toggle('active', b.dataset.id === select.value));
    });
  });
}

let graphSim = null;
function renderGraph(){
  const svg = d3.select('#graph-svg');
  svg.selectAll('*').remove();
  const wrapEl = document.getElementById('graph-svg-wrap');
  const width = wrapEl.clientWidth || 800;
  const height = wrapEl.clientHeight || 500;
  svg.attr('viewBox', `0 0 ${width} ${height}`);

  if(entries.length === 0){
    d3.select('#graph-svg-wrap').append('div').attr('class', 'graph-empty').text('Nothing logged yet — the graph fills in as you add sessions, papers, and decisions.');
    return;
  }

  const nodes = entries.map(e => ({ id: e.id, entry: e }));
  const nodeIds = new Set(nodes.map(n => n.id));
  const links = entries.filter(e => e.linked_id && nodeIds.has(e.linked_id))
    .map(e => ({ source: e.id, target: e.linked_id }));

  const g = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.4, 3]).on('zoom', (ev) => g.attr('transform', ev.transform)));

  if(graphSim) graphSim.stop();
  graphSim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(90).strength(0.6))
    .force('charge', d3.forceManyBody().strength(-170))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collide', d3.forceCollide(32));

  const link = g.selectAll('.graph-link').data(links).enter().append('line').attr('class', 'graph-link');

  const node = g.selectAll('.graph-node').data(nodes).enter().append('g')
    .attr('class', 'graph-node')
    .call(d3.drag()
      .on('start', (ev, d) => { if(!ev.active) graphSim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on('end', (ev, d) => { if(!ev.active) graphSim.alphaTarget(0); d.fx = null; d.fy = null; }))
    .on('click', (ev, d) => {
      document.getElementById('graph-modal').classList.remove('open');
      jumpToEntry(d.id);
    });

  node.append('circle').attr('r', d => d.entry.is_milestone ? 10 : 7).attr('fill', d => graphNodeColor(d.entry));
  node.append('text').attr('x', 11).attr('y', 4).text(d => graphNodeLabel(d.entry));

  graphSim.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}
function gcalLink(e){
  const title = encodeURIComponent((e.summary || 'Research session').slice(0, 80));
  const details = encodeURIComponent((e.summary || '') + (e.next_step ? '\n\nOpen question: ' + e.next_step : ''));
  let datesParam;
  if(e.time){
    const start = new Date(`${e.date}T${e.time}:00`);
    const durMin = e.duration || 60;
    const end = new Date(start.getTime() + durMin * 60000);
    const fmt = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    datesParam = `${fmt(start)}/${fmt(end)}`;
  } else {
    const d0 = new Date(e.date + 'T00:00:00');
    const d1 = new Date(d0.getTime() + 86400000);
    const fmt = (d) => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    datesParam = `${fmt(d0)}/${fmt(d1)}`;
  }
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${datesParam}&details=${details}`;
}
function entryText(e){
  return [
    e.summary, e.next_step, e.title, e.reason, e.decision,
    e.rationale, e.alternatives, e.link, (e.tags || []).join(' ')
  ].filter(Boolean).join(' ');
}

function entryText(e){
  return [
    e.summary, e.next_step, e.title, e.reason, e.decision,
    e.rationale, e.alternatives, e.link, (e.tags || []).join(' ')
  ].filter(Boolean).join(' ');
}

function linkedBadge(e){
  if(!e.linked_id) return '';
  const t = entries.find(x=>x.id===e.linked_id);
  if(!t) return '';
  const label = t.type==='session' ? `Session · ${fmtDate(t.date)}` : t.type==='paper' ? `Paper · ${t.title}` : t.type==='decision' ? `Decision · ${t.decision}` : `Account · ${t.title}`;
  return `<div class="linked-jump" onclick="event.stopPropagation(); jumpToEntry('${t.id}')">↳ linked to ${escapeHtml(label)} →</div>`;
}
function downstreamHtml(e){
  const items = entries.filter(x => x.linked_id === e.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(items.length === 0) return '';
  return `<div class="downstream-block">
    <span class="k">Led to</span>
    ${items.map(x => {
      const label = x.type==='session' ? `Session · ${fmtDate(x.date)}${x.is_milestone ? ' · ★ Milestone' : ''}`
        : x.type==='paper' ? `Paper · ${entryRowTitle(x)}`
        : x.type==='decision' ? `Decision · ${entryRowTitle(x)}`
        : `Account · ${entryRowTitle(x)}`;
      return `<div class="linked-jump" onclick="event.stopPropagation(); jumpToEntry('${x.id}')">↳ ${escapeHtml(label)} →</div>`;
    }).join('')}
  </div>`;
}
function renderMilestonePanel(){
  const list = document.getElementById('milestone-list');
  if(!list) return;
  const milestones = entries.filter(e => e.type === 'session' && e.is_milestone)
    .sort((a,b) => (b.date || '').localeCompare(a.date || ''));

  if(milestones.length === 0){
    list.innerHTML = `<div class="milestone-empty">No milestones logged yet — check "Milestone" on a session to mark one.</div>`;
  } else {
    list.innerHTML = milestones.map(m => `
      <div class="milestone-item" onclick="jumpToEntry('${m.id}'); document.getElementById('milestone-panel').classList.remove('open');">
        <span class="m-star">★</span>
        <span class="m-text">${escapeHtml(m.milestone_label || 'Milestone')}<span class="m-date">${fmtDate(m.date)}</span></span>
      </div>`).join('');
  }

  const toggle = document.getElementById('milestone-toggle');
  let badgeEl = toggle.querySelector('.todo-badge');
  if(milestones.length > 0){
    if(!badgeEl){ badgeEl = document.createElement('span'); badgeEl.className = 'todo-badge'; toggle.appendChild(badgeEl); }
    badgeEl.textContent = milestones.length;
  } else if(badgeEl){
    badgeEl.remove();
  }
}

function tagsHtml(e){
  return e.tags && e.tags.length ? `<div class="tags">${e.tags.map(t=>`<span class="tag" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join('<span class="tag-dot">•</span>')}</div>` : '';
}

function fmtTime(t){
  if(!t) return '';
  const [h, m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function entryRowTitle(e){
  if(e.type === 'session') return e.summary || '(no summary)';
  if(e.type === 'paper') return e.title || '(untitled)';
  if(e.type === 'decision') return e.decision || '(untitled decision)';
  if(e.type === 'account') return e.title || '(untitled)';
  return '';
}

function entryRowTitleHtml(e){
  const text = escapeHtml(entryRowTitle(e));
  if(e.type === 'paper' && e.link){
    return `<a href="${escapeHtml(e.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="title-link">${text}</a>`;
  }
  return text;
}

function entryStampHtml(e){
  if(e.type === 'session'){
    const stamp = e.is_milestone ? `<span class="stamp milestone">★ Milestone</span>` : `<span class="stamp session">Session</span>`;
    return `${stamp}<span class="entry-row-meta">${e.time ? fmtTime(e.time) + ' · ' : ''}${e.duration ? e.duration + ' min' : 'no duration'}</span>`;
  }
  if(e.type === 'paper'){
    const cls = e.verdict === 'accepted' ? 'paper-accepted' : e.verdict === 'rejected' ? 'paper-rejected' : e.verdict === 'alternate' ? 'paper-alternate' : 'paper-maybe';
    const label = e.verdict === 'accepted' ? 'Accepted' : e.verdict === 'rejected' ? 'Rejected' : e.verdict === 'related-work' ? 'Related work' : e.verdict === 'alternate' ? 'Alternate' : 'Extendable';
    return `<span class="stamp ${cls}">${label}</span>`;
  }
  if(e.type === 'decision') return `<span class="stamp decision">Decision</span>${e.outcome ? outcomeBadge(e) : ''}`;
  if(e.type === 'account') return `<span class="stamp account">Account</span>`;
  return '';
}

function outcomeBadge(e){
  if(!e.outcome) return '';
  const map = {
    holding: { label: 'Holding up', cls: 'outcome-holding' },
    revisited: { label: 'Revisited', cls: 'outcome-revisited' },
    reversed: { label: 'Reversed', cls: 'outcome-reversed' },
    superseded: { label: 'Superseded', cls: 'outcome-superseded' }
  };
  const m = map[e.outcome];
  if(!m) return '';
  return `<span class="stamp ${m.cls}">${m.label}</span>`;
}

function entryDetailHtml(e){
  if(e.type === 'session'){
    return `
      ${e.link ? `<a class="card-link" href="${escapeHtml(e.link)}" target="_blank" rel="noopener">${escapeHtml(e.link)}</a>` : ''}
      ${e.next_step ? `<div class="card-body"><span class="k">Open question</span><span class="${e.next_done ? 'resolved-text' : ''}">${escapeHtml(e.next_step)}</span></div>` : ''}
      ${e.calendar_added && e.calendar_event_link
        ? `<a class="cal-link cal-added" href="${escapeHtml(e.calendar_event_link)}" target="_blank" rel="noopener">✓ Synced to Calendar</a><button class="cal-link cal-btn" onclick="event.stopPropagation(); unlinkCalendarEvent('${e.id}')" style="margin-left:6px;">Unlink</button>`
        : `<button class="cal-link cal-btn" onclick="event.stopPropagation(); addToGoogleCalendar('${e.id}')">+ Add to Google Calendar</button>`}
      ${linkedBadge(e)}
      ${downstreamHtml(e)}`;
  }
  if(e.type === 'paper'){
    return `
      ${e.reason ? `<div class="card-body">${escapeHtml(e.reason)}</div>` : ''}
      ${tagsHtml(e)}
      ${linkedBadge(e)}
      ${downstreamHtml(e)}`;
  }
  if(e.type === 'decision'){
    return `
      ${e.rationale ? `<div class="card-body"><span class="k">Rationale</span>${escapeHtml(e.rationale)}</div>` : ''}
      ${e.alternatives ? `<div class="card-body"><span class="k">Alternatives considered</span>${escapeHtml(e.alternatives)}</div>` : ''}
      ${outcomeBadge(e)}
      ${tagsHtml(e)}
      ${linkedBadge(e)}
      ${downstreamHtml(e)}`;
  }
  if(e.type === 'account'){
    return `
      ${e.link ? `<a class="card-link" href="${escapeHtml(e.link)}" target="_blank" rel="noopener">${escapeHtml(e.link)}</a>` : ''}
      ${e.reason ? `<div class="card-body">${escapeHtml(e.reason)}</div>` : ''}
      ${tagsHtml(e)}
      ${linkedBadge(e)}
      ${downstreamHtml(e)}`;
  }
  return '';
}

function cardHtml(e, isExpanded){
  const verdictClass = e.type === 'paper' ? `verdict-${e.verdict || 'none'}` : '';
  return `
    <div class="card ${verdictClass}" data-entry-id="${e.id}">
      <div class="entry-row" onclick="toggleExpand('${e.id}')">
        <span class="chevron">${isExpanded ? '▾' : '▸'}</span>
        <div class="entry-row-main">
          ${entryStampHtml(e)}
          <span class="entry-row-title">${entryRowTitleHtml(e)}</span>
        </div>
        <div class="entry-row-actions" onclick="event.stopPropagation()">
          <button class="delete-btn" onclick="editEntry('${e.id}')" aria-label="Edit entry">✎</button>
          <button class="delete-btn" onclick="deleteEntry('${e.id}')" aria-label="Delete entry">×</button>
        </div>
      </div>
      ${isExpanded ? `<div class="entry-detail">${entryDetailHtml(e)}</div>` : ''}
    </div>`;
}

function refreshLinkDropdowns(){
  const options = entries.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>{
    const label = e.type==='session' ? `Session · ${fmtDate(e.date)}`
      : e.type==='paper' ? `Paper · ${e.title}`
      : e.type==='decision' ? `Decision · ${e.decision}`
      : `Account · ${e.title}`;
    return `<option value="${e.id}">${escapeHtml(label)}</option>`;
  }).join('');
  ['s-linked','p-linked','d-linked','a-linked'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ const cur = el.value; el.innerHTML = '<option value="">— none —</option>' + options; el.value = cur; }
  });
}

function monthKeyLabel(dateStr){
  const key = dateStr.slice(0,7); // 'YYYY-MM'
  const label = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month:'long', year:'numeric' });
  return { key, label };
}

function weekKeyLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const start = new Date(d); start.setDate(d.getDate() - d.getDay());
  const end = new Date(start); end.setDate(start.getDate() + 6);
  const key = `${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`;
  const fmt = (dt) => dt.toLocaleDateString('en-US', { month:'long', day:'numeric' });
  const label = `Week of ${fmt(start)} – ${fmt(end)}`;
  return { key, label };
}

function render(){
  if(!loaded){ timeline.innerHTML = '<div class="loading">Loading log…</div>'; return; }
  renderStats();
  renderTodo();
  renderMilestonePanel();

  let filtered;
  if(activeTagFilter){
    filtered = entries.filter(e => (e.tags || []).includes(activeTagFilter));
  } else {
    filtered = entries.filter(e => e.type === activeFilter);
    if(activeFilter === 'paper' && activeVerdictFilter !== 'all'){
      filtered = filtered.filter(e => e.verdict === activeVerdictFilter);
    }
    if(searchQuery){
      filtered = filtered.filter(e => entryText(e).toLowerCase().includes(searchQuery));
    }
  }
  if(filtered.length === 0){
    const isFiltering = !!searchQuery || !!activeTagFilter || (activeFilter === 'paper' && activeVerdictFilter !== 'all');
    timeline.innerHTML = isFiltering
      ? `<div class="empty-state"><div class="glyph">—</div><p>No results found.</p></div>`
      : `<div class="empty-state"><div class="glyph">—</div><p>Nothing logged yet. Add a session, a paper verdict, or a decision above.</p></div>`;
    return;
  }

  const tagBanner = activeTagFilter
    ? `<div class="tag-filter-banner">Filtered by tag: <strong>${escapeHtml(activeTagFilter)}</strong><button onclick="clearTagFilter()">Clear ×</button></div>`
    : '';

  // Milestones only apply to sessions. Split the (already newest-first) list
  // into segments each time a milestone entry is hit — that entry, plus every
  // older entry after it, belongs to its segment, until the next milestone.
  // Entries newer than the first milestone encountered sit in an unlabeled
  // segment at the top (nothing achieved yet). Note: date/month collapse
  // state is keyed by the plain date/month string, so if the same date ends
  // up split across two segments (a milestone mid-day), both instances share
  // one collapsed/expanded state — a rare edge case, not fully independent.
  const useMilestoneSegments = (activeFilter === 'session' && !activeTagFilter);
  let segments;
  if(useMilestoneSegments){
    segments = [];
    let label = null;
    let bucket = [];
    filtered.forEach(e => {
      if(e.is_milestone){
        segments.push({ label, entries: bucket });
        bucket = [];
        label = e.milestone_label || 'Milestone';
      }
      bucket.push(e);
    });
    segments.push({ label, entries: bucket });
    segments = segments.filter(s => s.entries.length > 0);
  } else {
    segments = [{ label: null, entries: filtered }];
  }

  // Flatten each segment's entries into consecutive same-date buckets, tagging
  // the first bucket of a labeled segment with the milestone divider it sits
  // below. This keeps one continuous month/week grouping across the whole
  // list — the divider only breaks the day-level flow, not month/week headings.
  const allBuckets = [];
  segments.forEach((seg, segIdx) => {
    seg.entries.forEach(e => {
      const dateKey = e.date || 'undated';
      const last = allBuckets[allBuckets.length - 1];
      if(last && last.dateKey === dateKey && last.segIdx === segIdx){
        last.entries.push(e);
      } else {
        allBuckets.push({ dateKey, entries: [e], segIdx, dividerLabel: (allBuckets.length === 0 || last.segIdx !== segIdx) ? seg.label : null });
      }
    });
  });

  const monthCounts = {}, weekCounts = {};
  allBuckets.forEach(b => {
    const undated = b.dateKey === 'undated';
    const mk = undated ? 'undated' : monthKeyLabel(b.dateKey).key;
    const wk = undated ? 'undated' : weekKeyLabel(b.dateKey).key;
    monthCounts[mk] = (monthCounts[mk] || 0) + b.entries.length;
    if(!undated) weekCounts[wk] = (weekCounts[wk] || 0) + b.entries.length;
  });

  let lastMonthKey = null, lastWeekKey = null;
  let monthCollapsedActive = false, weekCollapsedActive = false, milestoneCollapsedActive = false;
  let bodyHtml = '';

  allBuckets.forEach(b => {
    const undated = b.dateKey === 'undated';
    const mk = undated ? 'undated' : monthKeyLabel(b.dateKey).key;
    const wk = undated ? 'undated' : weekKeyLabel(b.dateKey).key;

    if(mk !== lastMonthKey){
      const monthLabel = undated ? 'Undated' : monthKeyLabel(b.dateKey).label;
      monthCollapsedActive = collapsedMonths.has(mk);
      bodyHtml += `
        <div class="month-heading" onclick="toggleMonth('${mk}')">
          <span class="chevron">${monthCollapsedActive ? '▸' : '▾'}</span>
          ${escapeHtml(monthLabel)}
          <span class="group-count">${monthCounts[mk]}</span>
        </div>`;
      lastMonthKey = mk;
      lastWeekKey = null;
    }

    if(!monthCollapsedActive && !undated && wk !== lastWeekKey){
      const weekLabel = weekKeyLabel(b.dateKey).label;
      weekCollapsedActive = collapsedWeeks.has(wk);
      bodyHtml += `
        <div class="week-heading" onclick="toggleWeek('${wk}')">
          <span class="chevron">${weekCollapsedActive ? '▸' : '▾'}</span>
          ${escapeHtml(weekLabel)}
          <span class="group-count">${weekCounts[wk]}</span>
        </div>`;
      lastWeekKey = wk;
    }

    if(b.dividerLabel){
      milestoneCollapsedActive = collapsedMilestones.has(String(b.segIdx));
      if(!monthCollapsedActive && !(!undated && weekCollapsedActive)){
        bodyHtml += `
          <div class="milestone-divider" onclick="toggleMilestone('${b.segIdx}')">
            <span class="chevron">${milestoneCollapsedActive ? '▸' : '▾'}</span>
            <span class="line"></span><span class="milestone-divider-label">★ ${escapeHtml(b.dividerLabel)}</span><span class="line"></span>
          </div>`;
      }
    }

    if(monthCollapsedActive) return;
    if(!undated && weekCollapsedActive) return;
    if(milestoneCollapsedActive) return;

    const dayCollapsed = collapsedDays.has(b.dateKey);
    bodyHtml += `
      <div class="day-group">
        <div class="day-heading" onclick="toggleDay('${b.dateKey}')">
          <span class="chevron">${dayCollapsed ? '▸' : '▾'}</span>
          ${undated ? 'Undated' : fmtDate(b.dateKey)}
          <span class="group-count">${b.entries.length}</span>
        </div>
        ${dayCollapsed ? '' : b.entries.map(e => cardHtml(e, expandedIds.has(e.id))).join('')}
      </div>`;
  });

  timeline.innerHTML = tagBanner + bodyHtml;
}

function toggleWeek(key){
  if(collapsedWeeks.has(key)) collapsedWeeks.delete(key); else collapsedWeeks.add(key);
  render();
}
window.toggleWeek = toggleWeek;

function toggleMilestone(segIdx){
  const key = String(segIdx);
  if(collapsedMilestones.has(key)) collapsedMilestones.delete(key); else collapsedMilestones.add(key);
  render();
}
window.toggleMilestone = toggleMilestone;

function toggleMonth(key){
  if(collapsedMonths.has(key)) collapsedMonths.delete(key); else collapsedMonths.add(key);
  render();
}
window.toggleMonth = toggleMonth;

function toggleDay(key){
  if(collapsedDays.has(key)) collapsedDays.delete(key); else collapsedDays.add(key);
  render();
}
window.toggleDay = toggleDay;

function applyDefaultCollapse(){
  const allDates = [...new Set(entries.map(e => e.date).filter(Boolean))].sort().reverse();
  allDates.slice(1).forEach(d => collapsedDays.add(d));
  const allMonths = [...new Set(allDates.map(d => d.slice(0,7)))].sort().reverse();
  allMonths.slice(1).forEach(m => collapsedMonths.add(m));
  const allWeeks = [...new Set(allDates.map(d => weekKeyLabel(d).key))].sort().reverse();
  allWeeks.slice(1).forEach(w => collapsedWeeks.add(w));
}

function renderStats(){
  const totalMinutes = entries.filter(e=>e.type==='session').reduce((sum,e)=> sum + (e.duration||0), 0);
  const hours = (totalMinutes/60).toFixed(1);
  const accepted = entries.filter(e=>e.type==='paper' && e.verdict==='accepted').length;
  const rejected = entries.filter(e=>e.type==='paper' && e.verdict==='rejected').length;
  const decisions = entries.filter(e=>e.type==='decision').length;

  const lastDate = entries.reduce((max,e)=> (e.date && e.date > max) ? e.date : max, '');
  let sinceLabel = '—', sinceStale = false;
  if(lastDate){
    const d = new Date(lastDate + 'T00:00:00');
    const now = new Date(); now.setHours(0,0,0,0);
    const days = Math.round((now - d) / 86400000);
    sinceLabel = days <= 0 ? 'Today' : days === 1 ? '1 day' : days + ' days';
    sinceStale = days > 6;
  }

  $('#stats').innerHTML = `
    <div class="stat"><span class="num">${hours}</span><span class="label">Hours logged</span></div>
    <div class="stat"><span class="num">${accepted}/${rejected}</span><span class="label">Papers acc/rej</span></div>
    <div class="stat"><span class="num">${decisions}</span><span class="label">Decisions</span></div>
    <div class="stat${sinceStale ? ' stat-warn' : ''}"><span class="num">${sinceLabel}</span><span class="label">Since last log</span></div>
  `;
}

function todoItemHtml(e, isDone){
  return `
    <div class="todo-item">
      <button class="todo-check ${isDone ? 'checked' : ''}" onclick="toggleNextDone('${e.id}', ${!isDone})">${isDone ? '✓' : ''}</button>
      <div class="todo-text ${isDone ? 'done' : ''}"><span class="date">${fmtDate(e.date)}</span>${escapeHtml(e.next_step)}</div>
    </div>`;
}

function renderTodo(){
  const withSteps = entries.filter(e => e.type === 'session' && e.next_step && e.next_step.trim());
  const active = withSteps.filter(e => !e.next_done).sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const done = withSteps.filter(e => e.next_done).sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  const list = document.getElementById('todo-list');
  if(!list) return;

  if(active.length === 0 && done.length === 0){
    list.innerHTML = `<div class="todo-empty">No open questions logged yet — they'll show up here from a session's "Next step" field.</div>`;
  } else {
    let html = active.length ? active.map(e => todoItemHtml(e, false)).join('') : `<div class="todo-empty">All caught up.</div>`;
    if(done.length){
      html += `<div class="todo-divider">Resolved</div>` + done.slice(0, 10).map(e => todoItemHtml(e, true)).join('');
    }
    list.innerHTML = html;
  }

  const toggle = document.getElementById('todo-toggle');
  let badgeEl = toggle.querySelector('.todo-badge');
  if(active.length > 0){
    if(!badgeEl){ badgeEl = document.createElement('span'); badgeEl.className = 'todo-badge'; toggle.appendChild(badgeEl); }
    badgeEl.textContent = active.length;
  } else if(badgeEl){
    badgeEl.remove();
  }
}

async function toggleNextDone(id, newVal){
  const { data, error } = await supabase.from('entries').update({ next_done: newVal }).eq('id', id).select();
  if(error){ showError('Could not update: ' + error.message); return; }
  entries = entries.map(x => x.id === id ? data[0] : x);
  render();
}
window.toggleNextDone = toggleNextDone;

async function markCalendarAdded(id){
  // Fallback path used only if Google Calendar isn't configured yet — just
  // opens the pre-filled template link and optimistically flags it as added,
  // with no real confirmation from Google.
  const e = entries.find(x => x.id === id);
  if(e && e.calendar_added) return;
  const { data, error } = await supabase.from('entries').update({ calendar_added: true }).eq('id', id).select();
  if(error) return;
  entries = entries.map(x => x.id === id ? data[0] : x);
  render();
}
window.markCalendarAdded = markCalendarAdded;



async function getFreshAccessToken(){
  const res = await fetch('/api/get-calendar-token');
  const data = await res.json();
  if(!data.access_token) throw new Error(data.error || 'Calendar not authorized — run the one-time setup');
  return data.access_token;
}

async function addToGoogleCalendar(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;

  try{
    const token = await getFreshAccessToken();
    await createCalendarEvent(e, token);
  } catch(err){
    showError('Could not add to Calendar: ' + err.message);
  }
}
window.addToGoogleCalendar = addToGoogleCalendar;

async function unlinkCalendarEvent(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;

  if(e.calendar_event_id){
    try{
      const token = await getFreshAccessToken();
      await reallyDeleteCalendarEvent(e, token);
      return;
    } catch(err){
      showError('Could not authorize deletion: ' + err.message);
      return;
    }
  }
  // fallback: no event id stored (older entry) — just clear locally
  await clearCalendarFields(id);
}

async function reallyDeleteCalendarEvent(e, token){
  try{
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${e.calendar_event_id}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if(!res.ok && res.status !== 410){ // 410 = already deleted on Google's side, treat as success
      const data = await res.json().catch(()=>({}));
      throw new Error(data.error?.message || 'Calendar API error');
    }
  } catch(err){
    showError('Could not delete from Calendar (removing local link anyway): ' + err.message);
  }
  await clearCalendarFields(e.id);
}

async function clearCalendarFields(id){
  const { data, error } = await supabase.from('entries')
    .update({ calendar_added: false, calendar_event_link: null, calendar_event_id: null })
    .eq('id', id).select();
  if(error){ showError('Could not unlink locally: ' + error.message); return; }
  entries = entries.map(x => x.id === id ? data[0] : x);
  render();
}
window.unlinkCalendarEvent = unlinkCalendarEvent;

async function createCalendarEvent(e, token){
  const body = buildCalendarEventBody(e);

  try{
    const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message || 'Calendar API error');

    const { data: updated, error } = await supabase.from('entries')
  .update({ calendar_added: true, calendar_event_link: data.htmlLink, calendar_event_id: data.id })
  .eq('id', e.id).select();
    if(error){ showError('Event created in Calendar, but could not save the link locally: ' + error.message); return; }
    entries = entries.map(x => x.id === e.id ? updated[0] : x);
    render();
  } catch(err){
    showError('Could not create the calendar event: ' + err.message);
  }
}

function buildCalendarEventBody(e){
  const summary = (e.summary || 'Research session').slice(0, 80);
  let description = e.summary || '';
  if(e.link) description += '\n\nLink: ' + e.link;
  if(e.next_step) description += '\n\nOpen question: ' + e.next_step;
  const body = { summary, description };
  if(e.time){
    const start = new Date(`${e.date}T${e.time}:00`);
    const durMin = e.duration || 60;
    const end = new Date(start.getTime() + durMin * 60000);
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    body.start = { dateTime: start.toISOString(), timeZone: tz };
    body.end = { dateTime: end.toISOString(), timeZone: tz };
  } else if(e.date){
    const d1 = new Date(e.date + 'T00:00:00'); d1.setDate(d1.getDate() + 1);
    body.start = { date: e.date };
    body.end = { date: d1.toISOString().slice(0, 10) };
  }
  return body;
}

// Pushes edits (summary, link, next step, date/time) to an already-linked
// Google Calendar event. If the event has been deleted or moved on Google's
// side, unlinks it locally instead of leaving a stale "Synced" badge that
// points nowhere.
async function updateCalendarEvent(e, token){
  const body = buildCalendarEventBody(e);
  const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${e.calendar_event_id}`, {
    method: 'PATCH',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if(res.status === 404 || res.status === 410){
    await clearCalendarFields(e.id);
    showError('The linked Calendar event no longer exists — unlinked locally. Use "Add to Google Calendar" to create a fresh one.');
    return;
  }

  const data = await res.json();
  if(!res.ok) throw new Error(data.error?.message || 'Calendar API error');

  const { data: updated, error } = await supabase.from('entries')
    .update({ calendar_event_link: data.htmlLink })
    .eq('id', e.id).select();
  if(!error && updated?.[0]){
    entries = entries.map(x => x.id === e.id ? updated[0] : x);
    render();
  }
}

async function syncCalendarEventUpdate(e){
  const msgEl = document.getElementById('msg-session');
  try{
    const token = await getFreshAccessToken();
    await updateCalendarEvent(e, token);
    if(msgEl){ msgEl.textContent = 'Updated · synced to Calendar'; setTimeout(() => msgEl.textContent = '', 2000); }
  } catch(err){
    if(msgEl){ msgEl.textContent = 'Updated (Calendar sync failed)'; setTimeout(() => msgEl.textContent = '', 2500); }
    showError('Could not sync changes to Calendar: ' + err.message);
  }
}

async function checkForNewCalendarEvents(){
  const btn = document.getElementById('cal-check-btn');

document.getElementById('cal-check-btn').addEventListener('click', checkForNewCalendarEvents);

async function loadPendingCalendarEvents(){
  const { data, error } = await supabase
    .from('calendar_review_queue')
    .select('*')
    .eq('status', 'pending')
    .order('start_time', { ascending: true });

  const panel = document.getElementById('pending-cal-panel');
  const list = document.getElementById('pending-cal-list');

  if(error){
    showError('Could not load pending calendar events: ' + error.message);
    return;
  }

  pendingCalEvents = data || [];

  if(pendingCalEvents.length === 0){
    list.innerHTML = '<div style="font-family:var(--sans); font-size:12.5px; color:var(--muted, #888); padding:4px 8px;">No pending events right now.</div>';
    return;
  }

  list.innerHTML = pendingCalEvents.map(ev => {
    const start = ev.start_time ? new Date(ev.start_time).toLocaleString() : '(no start time)';
    const end = ev.end_time ? new Date(ev.end_time).toLocaleString() : '';
    return `
      <div class="pending-cal-row" style="border:1px solid var(--line); border-radius:var(--radius); padding:10px; margin-bottom:8px;">
        <div style="font-family:var(--sans); font-size:13.5px; color:var(--ink); font-weight:600;">${escapeHtml(ev.title || '(no title)')}</div>
        <div style="font-family:var(--sans); font-size:12px; color:var(--muted, #888); margin:4px 0;">${escapeHtml(start)}${end ? ' → ' + escapeHtml(end) : ''}</div>
        ${ev.description ? `<div style="font-family:var(--sans); font-size:12.5px; white-space:pre-wrap; margin-bottom:8px;">${escapeHtml(ev.description)}</div>` : ''}
        <button class="cal-link cal-btn" onclick="reviewCalendarEvent('${ev.id}', 'approve')">✓ Approve → add as session</button>
        <button class="cal-link cal-btn" onclick="reviewCalendarEvent('${ev.id}', 'reject')" style="margin-left:6px;">✕ Reject</button>
      </div>`;
  }).join('');
}

async function reviewCalendarEvent(id, action){
  try{
    let body = { id, action };

    if(action === 'approve'){
      const ev = pendingCalEvents.find(x => x.id === id);
      if(ev && ev.start_time){
        const start = new Date(ev.start_time);
        const pad = n => String(n).padStart(2, '0');
        const localDate = `${start.getFullYear()}-${pad(start.getMonth()+1)}-${pad(start.getDate())}`;
        const localTime = `${pad(start.getHours())}:${pad(start.getMinutes())}`;
        let duration = null;
        if(ev.end_time){
          const end = new Date(ev.end_time);
          duration = Math.round((end - start) / 60000);
        }
        body.date = localDate;
        body.time = localTime;
        body.duration = duration;
      }
    }

    const res = await fetch('/api/review-calendar-event', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(!data.ok){ showError('Could not ' + action + ' event: ' + (data.error || 'unknown error')); return; }
    await loadPendingCalendarEvents();
    if(action === 'approve') await loadEntries(); // refresh Sessions tab to show the newly added entry
  } catch(err){
    showError('Could not ' + action + ' event: ' + err.message);
  }
}
window.reviewCalendarEvent = reviewCalendarEvent;

// ---------- Recap & Export ----------

function recapEntrySummary(e){
  if(e.type === 'session') return e.summary || '(no summary)';
  if(e.type === 'paper') return e.title || '(untitled paper)';
  if(e.type === 'decision') return e.decision || '(untitled decision)';
  if(e.type === 'account') return e.title || '(untitled)';
  return '';
}

function recapEntryDetail(e){
  const lines = [];
  if(e.type === 'session'){
    if(e.is_milestone) lines.push('★ Milestone: ' + (e.milestone_label || ''));
    if(e.next_step) lines.push('Next step: ' + e.next_step);
  }
  if(e.type === 'paper'){
    const verdictLabel = e.verdict === 'accepted' ? 'Accepted' : e.verdict === 'rejected' ? 'Rejected' : e.verdict === 'related-work' ? 'Related work' : e.verdict === 'alternate' ? 'Alternate' : 'Extendable';
    lines.push('Verdict: ' + verdictLabel);
    if(e.reason) lines.push(e.reason);
  }
  if(e.type === 'decision'){
    if(e.rationale) lines.push('Rationale: ' + e.rationale);
    if(e.alternatives) lines.push('Alternatives considered: ' + e.alternatives);
    if(e.outcome){
      const outcomeMap = { holding: 'Holding up', revisited: 'Revisited / refined', reversed: 'Reversed', superseded: 'Superseded by a later decision' };
      lines.push('Outcome: ' + (outcomeMap[e.outcome] || e.outcome));
    }
  }
  if(e.type === 'account'){
    if(e.reason) lines.push(e.reason);
  }
  return lines;
}

function resolveRecapEntries(scope, fromId, toId){
  const sorted = [...entries].sort((a,b) => (a.created_at||'').localeCompare(b.created_at||'') || (a.date||'').localeCompare(b.date||''));

  if(scope === 'since-last-session'){
    const sessions = sorted.filter(e => e.type === 'session');
    if(sessions.length < 2) return sorted;
    const cutoff = sessions[sessions.length - 2].created_at || '';
    return sorted.filter(e => (e.created_at || '') > cutoff);
  }
  if(scope === 'since-last-milestone'){
    const milestones = sorted.filter(e => e.is_milestone);
    if(milestones.length === 0) return sorted;
    const cutoff = milestones[milestones.length - 1].created_at || '';
    return sorted.filter(e => (e.created_at || '') >= cutoff);
  }
  if(scope === 'last-7' || scope === 'last-30'){
    const days = scope === 'last-7' ? 7 : 30;
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days); cutoff.setHours(0,0,0,0);
    const cutoffStr = cutoff.toISOString().slice(0,10);
    return sorted.filter(e => (e.date || '') >= cutoffStr);
  }
  if(scope === 'custom'){
    let fromDate = '', toDate = '';
    if(fromId){ const f = entries.find(x => x.id === fromId); if(f) fromDate = f.date || ''; }
    if(toId){ const t = entries.find(x => x.id === toId); if(t) toDate = t.date || ''; }
    return sorted.filter(e => (!fromDate || (e.date || '') >= fromDate) && (!toDate || (e.date || '') <= toDate));
  }
  return sorted; // 'all'
}

function populateRecapMilestoneSelects(){
  const milestones = [...entries].filter(e => e.is_milestone).sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const opts = milestones.map(m => `<option value="${m.id}">${escapeHtml(m.milestone_label || 'Milestone')} — ${fmtDate(m.date)}</option>`).join('');
  $('#recap-from').innerHTML = '<option value="">— Start —</option>' + opts;
  $('#recap-to').innerHTML = '<option value="">— Now —</option>' + opts;
}

function selectedRecapTypes(){
  return [...document.querySelectorAll('.recap-type-check:checked')].map(c => c.value);
}

function renderRecap(){
  const scope = $('#recap-scope').value;
  $('#recap-range-row').style.display = scope === 'custom' ? 'flex' : 'none';
  const fromId = $('#recap-from').value || null;
  const toId = $('#recap-to').value || null;
  const types = selectedRecapTypes();
  const scoped = resolveRecapEntries(scope, fromId, toId).filter(e => types.includes(e.type));
  document.getElementById('recap-ai-panel').style.display = 'none';

  const list = $('#recap-list');
  if(scoped.length === 0){
    list.innerHTML = `<div class="recap-empty">Nothing in this range.</div>`;
    return;
  }

  let lastDate = null;
  list.innerHTML = scoped.map(e => {
    const dateChanged = e.date !== lastDate;
    lastDate = e.date;
    const detailLines = recapEntryDetail(e);
    const typeLabel = e.type.charAt(0).toUpperCase() + e.type.slice(1);
    return `
      ${dateChanged ? `<div class="recap-day">${e.date ? fmtDate(e.date) : 'Undated'}</div>` : ''}
      <div class="recap-entry" onclick="document.getElementById('recap-modal').classList.remove('open'); jumpToEntry('${e.id}');">
        <div class="recap-entry-top"><span class="recap-entry-type">${typeLabel}</span><div class="recap-entry-title">${escapeHtml(recapEntrySummary(e))}</div></div>
        ${detailLines.length ? `<div class="recap-entry-detail">${detailLines.map(l => `<div class="recap-entry-line">${escapeHtml(l)}</div>`).join('')}</div>` : ''}
      </div>`;
  }).join('');
}

function recapScopeLabel(){
  const scope = $('#recap-scope').value;
  const map = {
    'since-last-session': 'Recap since last session',
    'since-last-milestone': 'Recap since last milestone',
    'last-7': 'Recap — last 7 days',
    'last-30': 'Recap — last 30 days',
    'custom': 'Recap — custom range',
    'all': 'Full research log'
  };
  return map[scope] || 'Recap';
}

function buildRecapText(markdown){
  const scope = $('#recap-scope').value;
  const fromId = $('#recap-from').value || null;
  const toId = $('#recap-to').value || null;
  const types = selectedRecapTypes();
  const scoped = resolveRecapEntries(scope, fromId, toId).filter(e => types.includes(e.type));
  const title = recapScopeLabel();

  let out = markdown ? `# ${title}\n\n` : `${title}\n${'='.repeat(title.length)}\n\n`;
  if(scoped.length === 0) return out + '(Nothing in this range.)\n';

  let lastDate = null;
  scoped.forEach(e => {
    if(e.date !== lastDate){
      lastDate = e.date;
      out += markdown ? `\n## ${e.date ? fmtDate(e.date) : 'Undated'}\n\n` : `\n${e.date ? fmtDate(e.date) : 'Undated'}\n${'-'.repeat(20)}\n`;
    }
    const typeLabel = e.type.toUpperCase();
    out += markdown ? `**${typeLabel}:** ${recapEntrySummary(e)}\n` : `[${typeLabel}] ${recapEntrySummary(e)}\n`;
    recapEntryDetail(e).forEach(line => { out += (markdown ? `- ${line}\n` : `  ${line}\n`); });
    out += '\n';
  });
  return out;
}

document.getElementById('recap-toggle').addEventListener('click', () => {
  document.getElementById('todo-panel').classList.remove('open');
  document.getElementById('milestone-panel').classList.remove('open');
  populateRecapMilestoneSelects();

  document.getElementById('recap-modal').classList.add('open');
});

  document.getElementById('recap-modal').classList.remove('open');
});
document.getElementById('recap-modal').addEventListener('click', (ev) => {

});
document.getElementById('recap-scope').addEventListener('change', renderRecap);
document.getElementById('recap-from').addEventListener('change', renderRecap);
document.getElementById('recap-to').addEventListener('change', renderRecap);

const backendSelect = document.getElementById('summarize-backend');
try{

  if(savedBackend) backendSelect.value = savedBackend;
}catch(e){}
backendSelect.addEventListener('change', () => {
  try{ localStorage.setItem('fieldlog-summarize-backend', backendSelect.value); }catch(e){}
});

document.getElementById('recap-copy-btn').addEventListener('click', async () => {
  const btn = document.getElementById('recap-copy-btn');
  try{
    await navigator.clipboard.writeText(buildRecapText(false));
    const orig = btn.textContent;
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = orig, 1500);
  } catch(err){
    showError('Could not copy: ' + err.message);
  }
});

document.getElementById('recap-download-btn').addEventListener('click', () => {
  const md = buildRecapText(true);
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const scopeSlug = $('#recap-scope').value;
  a.href = url;
  a.download = `recap-${scopeSlug}-${todayStr()}.md`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

function buildSummarizePrompt(text, scopeLabel){
  return `You are helping a graduate researcher recap their own research log for the EEG/EMG spiking-network fusion project. Below is a raw, already-distilled log covering: "${scopeLabel}".

Write a clear, well-organized narrative recap in plain prose — a few short paragraphs, not just repeating the bullet list back. Group related work together, call out any milestones or key decisions explicitly, and note any open questions or next steps at the end. Do not invent facts, numbers, or results that are not present in the log below. If the log is sparse, keep the recap short rather than padding it.

--- LOG START ---
${text}
--- LOG END ---

Recap:`;
}

async function summarizeWithGemini(text, scopeLabel){
  const res = await fetch('/api/summarize', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, scopeLabel })
  });
  const data = await res.json();
  if(!res.ok || data.error) throw new Error(data.error || 'Gemini returned no summary');
  return data.summary;
}

async function summarizeWithOllama(text, scopeLabel){
  const prompt = buildSummarizePrompt(text, scopeLabel);
  let res;
  try{
    res = await fetch('http://localhost:11434/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'llama3.1', prompt, stream: false })
    });
  } catch(err){
    throw new Error('Could not reach Ollama at localhost:11434 — is it running? (ollama serve)');
  }
  if(!res.ok) throw new Error('Ollama returned an error (HTTP ' + res.status + ')');
  const data = await res.json();
  if(!data.response) throw new Error('Ollama returned no text — check the model name matches what you pulled (ollama list)');
  return data.response;
}

document.getElementById('recap-ai-btn').addEventListener('click', async () => {
  const btn = document.getElementById('recap-ai-btn');
  const panel = document.getElementById('recap-ai-panel');
  const body = document.getElementById('recap-ai-body');
  const actions = document.getElementById('recap-ai-actions');
  const backend = backendSelect.value;

  const text = buildRecapText(false);
  const scopeLabel = recapScopeLabel();

  panel.style.display = 'block';
  actions.style.display = 'none';
  body.innerHTML = `<div class="recap-ai-loading">Summarizing via ${backend === 'ollama' ? 'local Ollama' : 'Gemini'}…</div>`;
  btn.disabled = true;

  try{
    const summary = backend === 'ollama'
      ? await summarizeWithOllama(text, scopeLabel)
      : await summarizeWithGemini(text, scopeLabel);
    body.innerHTML = `<div class="recap-ai-text">${escapeHtml(summary).replace(/\n/g, '<br>')}</div>`;
    actions.style.display = 'flex';
  } catch(err){
    body.innerHTML = `<div class="recap-ai-error">Could not generate a summary: ${escapeHtml(err.message)}</div>`;
  }
  btn.disabled = false;
});

document.getElementById('recap-ai-copy-btn').addEventListener('click', async () => {
  const btn = document.getElementById('recap-ai-copy-btn');
  const summaryEl = document.querySelector('#recap-ai-body .recap-ai-text');
  if(!summaryEl) return;
  try{
    await navigator.clipboard.writeText(summaryEl.textContent);
    const orig = btn.textContent;
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = orig, 1500);
  } catch(err){
    showError('Could not copy: ' + err.message);
  }
});

loadPendingCalendarEvents();
