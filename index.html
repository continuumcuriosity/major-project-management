<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Field Log</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      --bg: #13141b;
      --bg-panel: #1b1d27;
      --bg-panel-raised: #22242f;
      --line: #33364399;
      --paper: #ede6d6;
      --ink: #e8e5db;
      --ink-dim: #9a9baa;
      --ink-faint: #62647a;
      --amber: #c9a24b;
      --amber-dim: #c9a24b33;
      --radius: 3px;
      --serif: 'Newsreader', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
      --mono: 'JetBrains Mono', 'Courier New', monospace;

    }

    html[data-theme="light"] {
      --bg: #f4efe4;
      --bg-panel: #fbf8f0;
      --bg-panel-raised: #ffffff;
      --line: #d8cfba;
      --paper: #3a3428;
      --ink: #33301f;
      --ink-dim: #6b6552;
      --ink-faint: #9a9480;
      --amber: #a37c1f;
      --amber-dim: #a37c1f22;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(circle at 15% 8%, #ffffff05 0%, transparent 40%),
        radial-gradient(circle at 85% 60%, #ffffff04 0%, transparent 45%);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    ::selection {
      background: var(--amber-dim);
      color: var(--ink);
    }

    :focus-visible {
      outline: 1.5px solid var(--amber);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    .theme-footer {
      display: flex;
      justify-content: center;
      padding: 30px 0 10px;
    }

    .theme-toggle-btn {
      background: var(--bg-panel-raised);
      border: 1px solid var(--line);
      color: var(--ink-dim);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .06em;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
    }

    .theme-toggle-btn:hover {
      color: var(--amber);
      border-color: var(--amber);
    }

    /* setup screen */
    .setup {
      max-width: 560px;
      margin: 80px auto;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px;
    }

    .setup h2 {
      font-family: var(--serif);
      font-size: 22px;
      margin-bottom: 12px;
      color: var(--paper);
    }

    .setup p {
      font-size: 13.5px;
      color: var(--ink-dim);
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .setup code {
      background: var(--bg-panel-raised);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--amber);
    }

    .setup ol {
      padding-left: 20px;
      font-size: 13.5px;
      color: var(--ink-dim);
      line-height: 1.9;
    }

    .login-screen {
      max-width: 380px;
    }

    .login-screen .field-row {
      margin-bottom: 10px;
    }

    .signout-btn {
      background: none;
      border: 1px solid var(--line);
      color: var(--ink-faint);
      border-radius: 20px;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 13px;
      flex-shrink: 0;
    }

    .signout-btn:hover {
      color: var(--amber);
      border-color: var(--amber);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 14px;
    }

    .title-block .eyebrow {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 8px;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 30px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .subtitle {
      font-size: 13px;
      color: var(--ink-dim);
      margin-top: 4px;
    }

    .stats {
      display: flex;
      gap: 22px;
      font-family: var(--mono);
    }

    .stat {
      text-align: right;
    }

    .stat-warn .num {
      color: #a35a3a;
    }

    .stat .num {
      font-size: 19px;
      color: var(--paper);
      display: block;
    }

    .stat .label {
      font-size: 9.5px;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .composer {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 32px;
      overflow: hidden;
    }

    .type-tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
    }

    .type-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 12px 8px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }

    .type-tab:hover {
      color: var(--ink-dim);
    }

    .type-tab.active {
      color: var(--paper);
      border-bottom-color: var(--amber);
    }

    .composer-body {
      padding: 18px 18px 16px;
      display: none;
    }

    .composer-body.active {
      display: block;
    }

    .field-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .field {
      flex: 1;
      min-width: 140px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .ref-picker {
      position: relative;
    }

    .ref-picker-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 5px;
    }

    .ref-picker-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--amber-dim);
      border: 1px solid var(--amber);
      color: var(--amber);
      border-radius: 12px;
      padding: 3px 6px 3px 10px;
      font-size: 12px;
      max-width: 100%;
    }

    .ref-picker-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ref-picker-chip button {
      border: none;
      background: none;
      color: inherit;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 2px;
      opacity: .75;
    }

    .ref-picker-chip button:hover { opacity: 1; }

    .ref-picker-input {
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--bg-panel-raised);
      color: var(--ink);
    }

    .ref-picker-input:focus {
      outline: none;
      border-color: var(--amber);
    }

    .ref-picker-dropdown {
      display: none;
      position: absolute;
      z-index: 30;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 3px;
      max-height: 170px;
      overflow-y: auto;
      background: var(--bg-panel-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 20px -6px #00000055;
    }

    .ref-picker-dropdown.open { display: block; }

    .ref-picker-option {
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
      color: var(--ink-dim);
    }

    .ref-picker-option:hover {
      background: var(--bg-panel);
      color: var(--ink);
    }

    .ref-picker-empty {
      padding: 8px 10px;
      font-size: 12px;
      color: var(--ink-faint);
    }

    /* Multi-link picker: dropdown + plus button, adds a removable chip per pick */
    .link-multi-wrap { display: flex; flex-direction: column; gap: 6px; }

    .link-multi-row { display: flex; gap: 6px; align-items: center; }

    .link-multi-row select { flex: 1; min-width: 0; }

    .link-multi-add {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid var(--amber);
      background: var(--amber-dim);
      color: var(--amber);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .link-multi-add:hover { background: var(--amber); color: var(--bg-panel); }

    .link-multi-add:disabled { opacity: .4; cursor: not-allowed; }

    .link-multi-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    input,
    textarea,
    select {
      background: var(--bg-panel-raised);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13.5px;
      padding: 9px 10px;
      width: 100%;
    }

    textarea {
      resize: vertical;
      min-height: 54px;
      line-height: 1.5;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--ink-faint);
    }

    select {
      cursor: pointer;
    }

    .composer-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-add {
      background: var(--amber);
      color: #1a1508;
      border: none;
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 9px 18px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-add:hover {
      filter: brightness(1.08);
    }

    .btn-add:disabled {
      opacity: .5;
      cursor: default;
    }

    .save-msg {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-faint);
    }

    .save-msg.err {
      color: #c17a5c;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      font-family: var(--mono);
      font-size: 11px;
      flex-wrap: wrap;
      row-gap: 8px;
    }

    .filter-bar .flabel {
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-right: 4px;
    }

    .chip {
      background: none;
      border: 1px solid var(--line);
      color: var(--ink-dim);
      border-radius: 20px;
      padding: 4px 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .chip.active {
      border-color: var(--amber);
      color: var(--amber);
    }

    .day-group {
      margin-bottom: 20px;
    }

    .day-heading {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .month-group {
      margin-bottom: 8px;
    }

    .month-heading {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--amber);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 26px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--amber-dim);
      cursor: pointer;
    }

    .month-group:first-child .month-heading {
      margin-top: 0;
    }

    .group-count {
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--ink-faint);
      background: var(--bg-panel-raised);
      border-radius: 20px;
      padding: 1px 8px;
      margin-left: auto;
    }

    .month-heading .group-count {
      color: #8a7635;
      background: #c9a24b22;
    }

    .week-heading {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 12px;
      cursor: pointer;
    }

    .week-heading .chevron {
      color: var(--ink-faint);
    }

    .milestone-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 30px 0 10px;
      cursor: pointer;
    }

    .milestone-divider:first-child {
      margin-top: 0;
    }

    .milestone-divider .line {
      flex: 1;
      height: 1px;
      background: var(--amber-dim);
    }

    .milestone-divider .chevron {
      color: var(--amber);
    }

    .milestone-divider-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--amber);
      white-space: nowrap;
    }

    .card {
      background: var(--bg-panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 16px 12px;
      margin-bottom: 8px;
      position: relative;
    }

    .entry-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
    }

    .entry-row-main {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .entry-row-title {
      font-family: var(--serif);
      font-size: 14.5px;
      line-height: 1.35;
      color: var(--ink);
    }

    .entry-row-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-dim);
      white-space: nowrap;
    }

    .entry-row-actions {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .chevron {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-faint);
      flex-shrink: 0;
      width: 12px;
      text-align: center;
      margin-top: 3px;
      user-select: none;
    }

    .entry-row .chevron {
      color: var(--ink-faint);
    }

    .entry-detail {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
    }

.expand-controls button {
  background: none;
  border: none;
  color: var(--ink-faint);
  font-family: var(--mono);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: .05em;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  transition: color .15s;
}

.expand-controls button:hover {
  color: var(--amber);
}

.expand-controls {
  margin-left: auto;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
}

    .dash-select {
      width: auto;
      background: var(--bg-panel-raised);
      border: 1px solid var(--line);
      color: var(--ink-dim);
      font-family: var(--mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 4px 8px;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .dash-select:hover {
      border-color: var(--amber);
      color: var(--ink);
    }

    .dash-select:disabled {
      opacity: .45;
      cursor: default;
    }

    .dash-daterange-custom {
      display: none;
      gap: 6px;
      align-items: center;
    }

    .dash-date-input {
      width: auto;
      background: var(--bg-panel-raised);
      border: 1px solid var(--line);
      color: var(--ink-dim);
      font-family: var(--mono);
      font-size: 10.5px;
      padding: 3px 6px;
      border-radius: var(--radius);
    }

    .verdict-filter-bar {
      margin-top: -8px;
      margin-bottom: 18px;
      padding-left: 2px;
    }

    .verdict-filter-bar .chip {
      font-size: 10px;
      padding: 3px 10px;
    }

    .verdict-filter-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .verdict-filter-chips .chip {
      font-size: 10px;
      padding: 3px 10px;
    }

    .verdict-filter-chips .chip[data-value="all"].active {
      border-color: var(--amber);
      color: var(--amber);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      gap: 10px;
    }

    .stamp {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.12em;
      padding: 2px 7px;
      border-radius: 2px;
      text-transform: uppercase;
      border: 1px solid currentColor;
    }

    .stamp.session {
      color: #4a5b8a;
    }

    .stamp.paper-accepted {
      color: #4f7043;
    }

    .stamp.paper-rejected {
      color: #8a4a35;
    }

    .stamp.paper-maybe {
      color: #8a7635;
    }

    .stamp.paper-alternate {
      color: #4a5b8a;
    }

    .cal-link {
      display: inline-block;
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .04em;
      color: #4a5b8a;
      text-decoration: none;
      border-bottom: 1px dashed #4a5b8a88;
    }

    .cal-link:hover {
      color: #33436b;
    }

    .cal-link.cal-added {
      color: #4f7043;
      border-bottom-color: #4f704388;
    }

    .cal-link.cal-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .04em;
      cursor: pointer;
    }

    .meta-info {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-faint);
      margin-top: 5px;
      line-height: 1.5;
    }

    .verdict-toggle {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .verdict-chip {
      background: none;
      font-family: var(--mono);
    }

    .verdict-chip[data-value="accepted"].active {
      border-color: #4f7043;
      color: #4f7043;
    }

    .verdict-chip[data-value="rejected"].active {
      border-color: #8a4a35;
      color: #8a4a35;
    }

    .verdict-chip[data-value="maybe"].active {
      border-color: #8a7635;
      color: #8a7635;
    }

    .verdict-chip[data-value="alternate"].active {
      border-color: #4a5b8a;
      color: #4a5b8a;
    }

    .verdict-chip[data-value="related-work"].active {
      border-color: #6b6656;
      color: #6b6656;
    }

    .card.verdict-accepted {
      border-left: 3px solid #4f7043;
    }

    .card.verdict-rejected {
      border-left: 3px solid #8a4a35;
    }

    .card.verdict-maybe {
      border-left: 3px solid #8a7635;
    }

    .card.verdict-alternate {
      border-left: 3px solid #4a5b8a;
    }

    .card.verdict-related-work {
      border-left: 3px solid #6b6656;
    }

    .tag-dot {
      color: var(--ink-faint);
      font-size: 10px;
      margin: 0 1px;
    }

    .resolved-text {
      text-decoration: line-through;
      color: var(--ink-faint);
    }

    .title-link {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 2px;
    }

    .title-link:hover {
      color: #4a5b8a;
      text-decoration-color: #4a5b8a;
    }

    .link-suggest {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      align-items: center;
    }

    .link-suggest:empty {
      margin-top: 0;
    }

    .link-suggest-label {
      font-family: var(--mono);
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-faint);
    }

    .link-suggest-chip {
      background: var(--bg-panel-raised);
      border: 1px dashed var(--amber-dim);
      color: var(--ink-dim);
      font-family: var(--sans);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      cursor: pointer;
    }

    .link-suggest-chip:hover {
      border-color: var(--amber);
      color: var(--amber);
    }

    .link-suggest-chip.active {
      border-style: solid;
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-dim);
    }

    .downstream-block {

/* ===== ROADMAP ===== */
.roadmap-visual-wrap {
  width: 100%;
}

.roadmap-svg-wrap {
  position: relative;
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  background:
    radial-gradient(circle at 20% 10%, var(--amber-dim), transparent 50%),
    var(--bg-panel);
  padding: 20px 8px;
  overflow: hidden;
}

/* Path styling - softer, more subtle */
.roadmap-road-path {
  fill: none;
  stroke: var(--ink-faint);
  stroke-width: 4;
  stroke-linecap: round;
  opacity: .15;
}

.roadmap-road-dash {
  fill: none;
  stroke: var(--amber);
  stroke-width: 2;
  stroke-dasharray: 4 6;
  stroke-linecap: round;
  opacity: .35;
  animation: roadmap-flow 3s linear infinite;
}

@keyframes roadmap-flow { to { stroke-dashoffset: -20; } }

.roadmap-deadend-path {
  fill: none;
  stroke: var(--ink-faint);
  stroke-width: 2;
  stroke-dasharray: 3 4;
  stroke-linecap: round;
  opacity: .4;
}


/* Node circles - soft and elegant */
.roadmap-node {
  stroke: var(--bg-panel-raised);
  stroke-width: 2.5;
  cursor: pointer;
  transition: all .2s ease;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.15));
  transform-box: fill-box;
  transform-origin: center;
}

.roadmap-node:hover,
.roadmap-node.is-active {
  transform: scale(1.15);
  filter: drop-shadow(0 4px 12px rgba(0,0,0,.25));
}

.roadmap-node.is-static {
  cursor: default;
}
.roadmap-node.is-static:hover {
  transform: none;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.15));
}

.roadmap-node .roadmap-node-ring {
  fill: none;
  stroke: var(--amber);
  stroke-width: 1.5;
  opacity: .3;
}

/* Node colors - softer, more muted */
.roadmap-node-c0 { fill: #4a9b7f; }
.roadmap-node-c1 { fill: #d4a03a; }
.roadmap-node-c2 { fill: #c1554a; }
.roadmap-node-c3 { fill: #5b7fbf; }
.roadmap-node-c4 { fill: #8a8a8a; }

/* Anchor nodes - the Start/End markers */
.roadmap-node-anchor {
  fill: #1c2230;
  stroke: var(--amber);
  stroke-width: 2.5;
}

.roadmap-node-anchor.is-now {
  animation: roadmap-now-pulse 2.4s ease-in-out infinite;
}

@keyframes roadmap-now-pulse {
  0%, 100% { filter: drop-shadow(0 0 0 var(--amber)); }
  50% { filter: drop-shadow(0 0 12px var(--amber)); }
}

.roadmap-anchor-halo {
  fill: var(--amber-dim);
  stroke: var(--amber);
  stroke-width: 0.5;
  opacity: .25;
}

/* Node labels - clean and minimal */
.roadmap-node-label {
  font-family: var(--sans);
  font-size: 10px;
  fill: var(--ink-dim);
  pointer-events: none;
  user-select: none;
  text-anchor: middle;
  letter-spacing: .01em;
  opacity: .75;
}

.roadmap-node-label.is-anchor {
  font-family: var(--mono);
  font-size: 8.5px;
  fill: var(--amber);
  text-transform: uppercase;
  letter-spacing: .08em;
  opacity: .8;
}

.roadmap-anchor-caption {
  font-family: var(--mono);
  font-size: 7.5px;
  font-weight: 600;
  letter-spacing: .12em;
  fill: var(--ink-faint);
  text-anchor: middle;
  pointer-events: none;
  opacity: .5;
}

/* Node cards - minimal, inline tooltips */
.roadmap-node-card {
  background: var(--bg-panel);
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink);
  box-shadow: 0 4px 16px -6px #00000055;
  cursor: pointer;
  box-sizing: border-box;
  overflow: hidden;
  transition: all .2s ease;
  display: flex;
  flex-direction: column;
  justify-content: center;
  backdrop-filter: blur(4px);
  border: 1px solid var(--line);
}

.roadmap-node-card:hover {
  border-color: var(--amber);
  box-shadow: 0 8px 22px -6px #000000aa;
  background: var(--bg-panel-raised);
}

.roadmap-node-card-title {
  font-weight: 500;
  font-size: 11px;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--ink);
}

.roadmap-node-card-type {
  color: var(--amber);
  font-size: 8.5px;
  letter-spacing: .03em;
  opacity: .6;
  margin-top: 1px;
}

.roadmap-node-card-hint {
  display: none;
}

/* Add marker - elegant plus */
.roadmap-add-marker {
  cursor: pointer;
  opacity: 0.2;
  transition: all .2s ease;
}
.roadmap-add-marker:hover,
.roadmap-add-marker:focus {
  opacity: 1;
  outline: none;
}
.roadmap-add-marker circle {
  fill: var(--bg-panel-raised);
  stroke: var(--amber);
  stroke-width: 1.5;
  stroke-dasharray: 2 3;
}
.roadmap-add-marker text {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  fill: var(--amber);
  pointer-events: none;
  user-select: none;
  text-anchor: middle;
}

/* Side panel */
.roadmap-tooltip {
  position: fixed;
  z-index: 90;
  max-width: 200px;
  background: var(--bg-panel);
  border: 1px solid var(--amber);
  border-radius: 8px;
  padding: 8px 12px;
  font-family: var(--sans);
  font-size: 11.5px;
  color: var(--ink);
  box-shadow: 0 8px 24px #00000055;
  opacity: 0;
  transform: translateY(4px) scale(0.96);
  pointer-events: none;
  transition: opacity .15s, transform .15s;
}

.roadmap-tooltip.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.roadmap-tooltip-title {
  font-weight: 600;
  margin-bottom: 2px;
}

.roadmap-tooltip-choice {
  color: var(--amber);
  font-size: 10px;
  margin-bottom: 2px;
  opacity: .7;
}

.roadmap-tooltip-hint {
  color: var(--ink-faint);
  font-size: 8px;
  margin-top: 4px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: .06em;
  opacity: .5;
}

/* Responsive tweaks */
@media (max-width: 640px) {
  .roadmap-svg-wrap {
    padding: 12px 4px;
    border-radius: 8px;
  }
  .roadmap-node-card {
    padding: 4px 8px;
    font-size: 10px;
  }
  .roadmap-node-card-title {
    font-size: 10px;
  }
}

        if (error) {
          // Transient clock-skew hiccup on cold start ("JWT issued at future") - the token
          // is briefly seen as not-yet-valid before client/server clocks reconcile. A reload
          // always fixes it, so retry silently a couple of times before bothering the user.
          const isClockSkew = /issued at future/i.test(error.message || '');
          if (isClockSkew && _retryCount < 3) {
            await new Promise(r => setTimeout(r, 400 * (_retryCount + 1)));
            return loadEntries(_retryCount + 1);
          }
          showError('Could not load entries: ' + error.message);
          entries = [];

      // Generic "is there a link?" panel: a checkbox reveals type chips, each chip reveals
      // its own select (or, for the shared entry types, a single select filtered to the checked types).
      // Registry of select+plus+chips multi-link pickers, keyed by the <select> id.
      // A dedicated link type becomes "multi" simply by having a sibling
      // #{selectId}-add button and #{selectId}-chips container in the markup —
      // wireLinkPanel() below picks it up automatically. This is the reusable
      // piece for rolling the same pattern out to other tick boxes/forms.
      const multiLinkRegistry = {};

      function wireMultiLinkSelect(selectId) {
        const select = document.getElementById(selectId);
        const addBtn = document.getElementById(selectId + '-add');
        const chipsEl = document.getElementById(selectId + '-chips');
        if (!select || !addBtn || !chipsEl) return null; // not converted to multi-link yet

        let selected = [];
        let options = [];

        function labelFor(id) {
          const opt = options.find(o => o.id === id);
          return opt ? opt.label : '(deleted)';
        }

        function renderChips() {
          chipsEl.innerHTML = selected.map(id =>
            `<span class="ref-picker-chip" data-id="${id}"><span>${escapeHtml(labelFor(id))}</span><button type="button" data-remove="${id}" aria-label="Remove">×</button></span>`
          ).join('');
          chipsEl.querySelectorAll('button[data-remove]').forEach(b => {
            b.addEventListener('click', () => {
              selected = selected.filter(x => x !== b.dataset.remove);
              renderChips();
              renderSelect();
            });
          });
        }

        function renderSelect() {
          const cur = select.value;
          const avail = options.filter(o => !selected.includes(o.id));
          select.innerHTML = '<option value="">— select —</option>' +
            avail.map(o => `<option value="${o.id}">${escapeHtml(o.label)}</option>`).join('');
          select.value = avail.some(o => o.id === cur) ? cur : '';
          addBtn.disabled = !avail.length;
        }

        addBtn.addEventListener('click', () => {
          const val = select.value;
          if (!val || selected.includes(val)) return;
          selected.push(val);
          renderChips();
          renderSelect();
        });

        const controller = {
          setOptions(opts) { options = opts || []; renderSelect(); },
          getValue: () => selected.slice(),
          setValue: (ids) => { selected = (ids || []).filter(Boolean).slice(); renderChips(); renderSelect(); },
          reset: () => { selected = []; renderChips(); renderSelect(); }
        };
        multiLinkRegistry[selectId] = controller;
        return controller;
      }

      // Returns { scalar, ids } for a dedicated link select — scalar is kept in
      // sync (first pick) for any old code still reading the singular column.
      function multiLinkField(selectId) {
        const multi = multiLinkRegistry[selectId];
        if (multi) {
          const ids = multi.getValue();
          return { scalar: ids[0] || null, ids };
        }
        const el = document.getElementById(selectId);
        const val = el ? (el.value || null) : null;
        return { scalar: val, ids: val ? [val] : [] };
      }

      // Prefers the new array column; falls back to the legacy scalar column
      // for rows saved before that type was converted to a multi-link picker.
      function linkedIdsFor(e, singularCol, arrayCol) {
        if (Array.isArray(e[arrayCol]) && e[arrayCol].length) return e[arrayCol];
        return e[singularCol] ? [e[singularCol]] : null;
      }

      function wireLinkPanel(prefix, opts) {
        opts = opts || {};
        const entryTypes = opts.entryTypes || [];      // types that all share one <select id="{prefix}-linked">
        const dedicated = opts.dedicated || [];         // [{type, selectId}] each with its own select + own DB column
        const enableCb = document.getElementById(prefix + '-link-enable');
        const panel = document.getElementById(prefix + '-link-panel');
        if (!enableCb || !panel) return null;

        const entryWrap = entryTypes.length ? document.getElementById(prefix + '-link-entry-wrap') : null;
        const entrySelect = entryTypes.length ? document.getElementById(prefix + '-linked') : null;
        const entryChips = entryTypes.map(t => ({ type: t, cb: document.getElementById(prefix + '-link-chip-' + t) }));

        const dedicatedChips = dedicated.map(d => ({
          type: d.type,
          cb: document.getElementById(prefix + '-link-chip-' + d.type),
          wrap: document.getElementById((d.wrapId || (prefix + '-link-' + d.type + '-wrap'))),
          select: document.getElementById(d.selectId),
          multi: wireMultiLinkSelect(d.selectId)
        }));

        function labelFor(e) {
          return e.type === 'session' ? `Session · ${fmtDate(e.date)}`
            : e.type === 'paper' ? `Paper · ${e.title || '(untitled)'}`
            : e.type === 'decision' ? `Decision · ${e.decision || '(untitled)'}`
            : `Account · ${e.title || '(untitled)'}`;
        }

        function refreshEntryOptions() {
          if (!entrySelect) return;
          const activeTypes = entryChips.filter(c => c.cb && c.cb.checked).map(c => c.type);
          const cur = entrySelect.value;
          const filtered = activeTypes.length ? entries.filter(x => activeTypes.includes(x.type)) : [];
          const opts = filtered.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))
            .map(x => `<option value="${x.id}">${escapeHtml(labelFor(x))}</option>`).join('');
          entrySelect.innerHTML = '<option value="">— none —</option>' + opts;
          entrySelect.value = filtered.some(x => x.id === cur) ? cur : '';
          if (entryWrap) entryWrap.style.display = activeTypes.length ? 'block' : 'none';
        }

        entryChips.forEach(c => { if (c.cb) c.cb.addEventListener('change', refreshEntryOptions); });

        dedicatedChips.forEach(d => {
          if (!d.cb) return;
          d.cb.addEventListener('change', () => {
            if (d.wrap) d.wrap.style.display = d.cb.checked ? 'block' : 'none';
            if (!d.cb.checked) {
              if (d.multi) d.multi.reset();
              else if (d.select) d.select.value = '';
            }
          });
        });

        enableCb.addEventListener('change', () => {
          panel.style.display = enableCb.checked ? 'flex' : 'none';
          if (!enableCb.checked) {
            entryChips.forEach(c => { if (c.cb) c.cb.checked = false; });
            if (entryWrap) entryWrap.style.display = 'none';
            if (entrySelect) entrySelect.value = '';
            dedicatedChips.forEach(d => {
              if (d.cb) d.cb.checked = false;
              if (d.wrap) d.wrap.style.display = 'none';
              if (d.multi) d.multi.reset();
              else if (d.select) d.select.value = '';
            });
          }
        });

        return {
          refreshEntryOptions,
          // Populate panel state from a saved entry/item. linkedId = single-select linked_id.
          // dedicatedValues = { type: id } for dedicated columns (e.g. roadmap's decision/session/paper).
          setState(linkedId, dedicatedValues) {
            dedicatedValues = dedicatedValues || {};
            const hasAny = !!linkedId || Object.values(dedicatedValues).some(v => Array.isArray(v) ? v.length > 0 : !!v);
            enableCb.checked = hasAny;
            panel.style.display = hasAny ? 'flex' : 'none';

            entryChips.forEach(c => { if (c.cb) c.cb.checked = false; });
            if (entrySelect) entrySelect.innerHTML = '<option value="">— none —</option>';
            if (entrySelect) entrySelect.value = '';
            if (entryWrap) entryWrap.style.display = 'none';
            if (linkedId && entrySelect) {
              const target = entries.find(x => x.id === linkedId);
              if (target) {
                const chip = entryChips.find(c => c.type === target.type);
                if (chip && chip.cb) chip.cb.checked = true;
              }
              refreshEntryOptions();
              entrySelect.value = linkedId;
            }

            dedicatedChips.forEach(d => {
              const val = dedicatedValues[d.type];
              const hasVal = Array.isArray(val) ? val.length > 0 : !!val;
              if (d.cb) d.cb.checked = hasVal;
              if (d.wrap) d.wrap.style.display = hasVal ? 'block' : 'none';
              if (d.multi) {
                d.multi.setValue(Array.isArray(val) ? val : (val ? [val] : []));
              } else if (d.select) {
                d.select.value = val || '';
              }
            });
          }
        };
      }

      // Searchable multi-select reference picker: type to filter, click to add a
      // chip, remove via ×. Used for "Decision extracted" / "Roadmap node updated"
      // on the session form, since a session can produce more than one of each and
      // the option list grows every time you log a new decision or roadmap node —
      // a single dropdown doesn't scale for that.
      function createRefPicker(prefix, getOptions) {
        const chipsEl = document.getElementById(prefix + '-chips');
        const inputEl = document.getElementById(prefix + '-input');
        const dropEl = document.getElementById(prefix + '-dropdown');
        let selected = [];

        function labelFor(id) {
          const opt = getOptions().find(o => o.id === id);
          return opt ? opt.label : '(deleted)';
        }

        function renderChips() {
          chipsEl.innerHTML = selected.map(id =>
            `<span class="ref-picker-chip" data-id="${id}"><span>${escapeHtml(labelFor(id))}</span><button type="button" data-remove="${id}" aria-label="Remove">×</button></span>`
          ).join('');
          chipsEl.querySelectorAll('button[data-remove]').forEach(b => {
            b.addEventListener('click', () => {
              selected = selected.filter(x => x !== b.dataset.remove);
              renderChips();
            });
          });
        }

        function renderDropdown(query) {
          const q = (query || '').toLowerCase();
          const all = getOptions().filter(o => !selected.includes(o.id));
          const opts = (q ? all.filter(o => o.label.toLowerCase().includes(q)) : all).slice(0, 8);
          if (!opts.length) {
            dropEl.innerHTML = `<div class="ref-picker-empty">${all.length ? 'No matches' : 'Nothing to link yet'}</div>`;
            dropEl.classList.add('open');
            return;
          }
          dropEl.innerHTML = opts.map(o => `<div class="ref-picker-option" data-id="${o.id}">${escapeHtml(o.label)}</div>`).join('');
          dropEl.classList.add('open');
          dropEl.querySelectorAll('.ref-picker-option').forEach(el => {
            el.addEventListener('mousedown', (ev) => {
              ev.preventDefault();
              selected.push(el.dataset.id);
              renderChips();
              inputEl.value = '';
              renderDropdown('');
              inputEl.focus();
            });
          });
        }

        inputEl.addEventListener('input', () => renderDropdown(inputEl.value));
        inputEl.addEventListener('focus', () => renderDropdown(inputEl.value));
        inputEl.addEventListener('blur', () => setTimeout(() => dropEl.classList.remove('open'), 150));

        return {
          getValue: () => selected.slice(),
          setValue: (ids) => { selected = (ids || []).slice(); renderChips(); },
          reset: () => { selected = []; renderChips(); inputEl.value = ''; dropEl.classList.remove('open'); dropEl.innerHTML = ''; }
        };
      }

      async function tryFetchPaperMetadata(link) {
        const infoEl = document.getElementById('p-meta-info');
        if (!link) { infoEl.textContent = ''; return; }

        const doiMatch = link.match(/10\.\d{4,9}\/[^\s"'<>]+/);
        if (doiMatch) {
          await fetchFromCrossref(doiMatch[0].replace(/[.,)]+$/, ''), infoEl);
          return;
        }

        infoEl.textContent = 'Looking up page details…';
        try {
          const res = await fetch(`/api/fetch-meta?url=${encodeURIComponent(link)}`);
          const json = await res.json();
          if (json.ok && json.title) {
            if (!$('#p-title').value.trim()) $('#p-title').value = json.title;
            if (json.description && !$('#p-reason').value.trim()) $('#p-reason').value = json.description.slice(0, 300);
            let line = `Found: ${json.title}`;
            if (json.authors && json.authors.length) line += ` — ${json.authors[0]}${json.authors.length > 1 ? ' et al.' : ''}`;
            if (json.year) line += `, ${json.year}`;
            infoEl.textContent = line;
          } else {
            infoEl.textContent = json.error ? `Could not auto-extract (${json.error})` : 'Could not auto-extract details — enter manually.';
          }
        } catch (err) {
          infoEl.textContent = 'Auto-lookup unavailable — enter details manually.';
        }
      }

      async function fetchFromCrossref(doi, infoEl) {
        infoEl.textContent = 'Looking up metadata…';
        try {
          const res = await fetch(`https://api.crossref.org/works/${encodeURIComponent(doi)}`);
          if (!res.ok) throw new Error('not found');
          const json = await res.json();
          const item = json.message;
          const title = item.title && item.title[0];
          const authors = (item.author || []).map(a => a.family).filter(Boolean);
          const year = (item['published-print'] || item['published-online'] || item.created || {})['date-parts']?.[0]?.[0];
          if (title) {
            if (!$('#p-title').value.trim()) $('#p-title').value = title;
            if (item['container-title'] && item['container-title'][0] && !$('#p-reason').value.trim()) {
              $('#p-reason').value = `Published in ${item['container-title'][0]}${year ? ' (' + year + ')' : ''}.`;
            }
            infoEl.textContent = `Found via CrossRef: ${title}${authors.length ? ' — ' + authors[0] + (authors.length > 1 ? ' et al.' : '') : ''}${year ? ', ' + year : ''}`;
          } else {
            infoEl.textContent = '';
          }
        } catch (err) {
          infoEl.textContent = 'No DOI metadata found — enter details manually.';
        }
      }

      function debounce(fn, ms) {
        let t;

      const NON_TITLES = new Set(['(no summary)', '(untitled)', '(untitled decision)', '']);

      function scanForLinkMentions(text, prefix, excludeId) {
        const box = document.getElementById(prefix + '-link-suggest');
        if (!box) return;
        const trimmed = (text || '').trim();
        if (trimmed.length < 4) { box.innerHTML = ''; return; }
        const lower = trimmed.toLowerCase();
        const matches = entries
          .filter(e => e.id !== excludeId)
          .map(e => ({ e, title: entryRowTitle(e) }))
          .filter(({ title }) => !NON_TITLES.has(title) && title.length >= 4 && lower.includes(title.toLowerCase()))
          .slice(0, 3);

        if (matches.length === 0) { box.innerHTML = ''; return; }

        box.innerHTML = `<span class="link-suggest-label">Mentioned:</span>` + matches.map(({ e, title }) => {
          const short = title.length > 28 ? title.slice(0, 26) + '…' : title;
          const select = document.getElementById(prefix + '-linked-' + e.type);
          const active = select && select.value === e.id ? ' active' : '';
          return `<button type="button" class="link-suggest-chip${active}" data-id="${e.id}" data-type="${e.type}">${escapeHtml(short)} → link</button>`;
        }).join('');

        box.querySelectorAll('.link-suggest-chip').forEach(btn => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.type;
            const select = document.getElementById(prefix + '-linked-' + type);
            const chip = document.getElementById(prefix + '-link-chip-' + type);
            const wrap = document.getElementById(prefix + '-link-' + type + '-wrap');
            const enableCb = document.getElementById(prefix + '-link-enable');
            const panel = document.getElementById(prefix + '-link-panel');
            if (!select) return;
            const turningOn = select.value !== btn.dataset.id;
            select.value = turningOn ? btn.dataset.id : '';
            if (chip) chip.checked = turningOn;
            if (wrap) wrap.style.display = turningOn ? 'block' : 'none';
            if (turningOn) {
              if (enableCb) enableCb.checked = true;
              if (panel) panel.style.display = 'flex';
            }
            box.querySelectorAll('.link-suggest-chip').forEach(b =>
              b.classList.toggle('active', b.dataset.type === type && b.dataset.id === select.value)
            );
          });
        });
      }

        if (e.type === 'paper') {

                  : '#8a7635';
        }

      function graphNodeLabel(e) {

      let graphSim = null;
      function renderGraph() {
        const svg = d3.select('#graph-svg');
        svg.selectAll('*').remove();
        const wrapEl = document.getElementById('graph-svg-wrap');
        const width = wrapEl.clientWidth || 800;
        const height = wrapEl.clientHeight || 500;
        svg.attr('viewBox', `0 0 ${width} ${height}`);

        if (entries.length === 0) {
          d3.select('#graph-svg-wrap').append('div').attr('class', 'graph-empty').text('Nothing logged yet — the graph fills in as you add sessions, papers, and decisions.');
          return;
        }

        const nodes = entries.map(e => ({ id: e.id, entry: e }));
        const nodeIds = new Set(nodes.map(n => n.id));
        const links = [];
        entries.forEach(e => {
          ['linked_decision_id', 'linked_session_id', 'linked_paper_id', 'linked_account_id'].forEach(col => {
            const target = e[col];
            if (target && nodeIds.has(target)) links.push({ source: e.id, target });
          });
        });

        const g = svg.append('g');
        svg.call(d3.zoom().scaleExtent([0.4, 3]).on('zoom', (ev) => g.attr('transform', ev.transform)));

        if (graphSim) graphSim.stop();
        graphSim = d3.forceSimulation(nodes)
          .force('link', d3.forceLink(links).id(d => d.id).distance(90).strength(0.6))
          .force('charge', d3.forceManyBody().strength(-170))
          .force('center', d3.forceCenter(width / 2, height / 2))
          .force('collide', d3.forceCollide(32));

        const link = g.selectAll('.graph-link').data(links).enter().append('line').attr('class', 'graph-link');

        const node = g.selectAll('.graph-node').data(nodes).enter().append('g')
          .attr('class', 'graph-node')
          .call(d3.drag()
            .on('start', (ev, d) => { if (!ev.active) graphSim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
            .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
            .on('end', (ev, d) => { if (!ev.active) graphSim.alphaTarget(0); d.fx = null; d.fy = null; }))
          .on('click', (ev, d) => {
            document.getElementById('archive-modal').classList.remove('open');
            jumpToEntry(d.id);
          });

        node.append('circle').attr('r', d => d.entry.is_milestone ? 10 : 7).attr('fill', d => graphNodeColor(d.entry));
        node.append('text').attr('x', 11).attr('y', 4).text(d => graphNodeLabel(d.entry));

        graphSim.on('tick', () => {
          link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
          node.attr('transform', d => `translate(${d.x},${d.y})`);
        });
      }

            || (activeFilter === 'paper' && activeVerdictFilter !== 'all')
            || (activeFilter === 'session' && activeMilestoneFilter !== 'all') || (activeFilter === 'decision' && activeOutcomeFilter !== 'all');
          timeline.innerHTML = isFiltering
            ? `<div class="empty-state"><div class="glyph">
                <svg class="empty-astro empty-astro-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="88" height="88" aria-hidden="true">
