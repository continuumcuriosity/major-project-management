                  <path d="M 10 110 C 25 90, 20 65, 42 58" fill="none" stroke="#596173" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
                  <g transform="translate(35, 25) rotate(12 30 35)">
                    <rect x="8" y="18" width="12" height="28" rx="4" fill="#596173"/>
                    <rect x="16" y="20" width="28" height="30" rx="8" fill="#ECEFF4"/>
                    <rect x="23" y="25" width="14" height="8" rx="2" fill="#E5B242"/>
                    <circle cx="30" cy="16" r="16" fill="#ECEFF4"/>
                    <ellipse cx="33" cy="16" rx="10" ry="8" fill="#E5B242"/>
                    <path d="M 27 12 Q 33 10, 37 13" fill="none" stroke="#0F111A" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                    <path d="M 18 26 C 10 30, 8 42, 14 46" fill="none" stroke="#ECEFF4" stroke-width="5" stroke-linecap="round"/>
                    <path d="M 42 26 C 52 32, 50 44, 44 48" fill="none" stroke="#ECEFF4" stroke-width="5" stroke-linecap="round"/>
                    <path d="M 22 48 C 18 58, 20 68, 16 74" fill="none" stroke="#ECEFF4" stroke-width="6" stroke-linecap="round"/>
                    <path d="M 38 48 C 42 58, 40 70, 46 76" fill="none" stroke="#ECEFF4" stroke-width="6" stroke-linecap="round"/>
                  </g>
                </svg>
                <svg class="empty-astro empty-astro-light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="88" height="88" aria-hidden="true">
                  <g fill="#8C827A"><circle cx="20" cy="25" r="1.5" opacity="0.6"/><circle cx="95" cy="20" r="1" opacity="0.4"/><circle cx="105" cy="85" r="1.5" opacity="0.5"/><circle cx="15" cy="90" r="1" opacity="0.3"/></g>
                  <path d="M 10 110 C 25 90, 20 65, 42 58" fill="none" stroke="#8C827A" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
                  <g transform="translate(35, 25) rotate(12 30 35)">
                    <rect x="8" y="18" width="12" height="28" rx="4" fill="#8C827A"/>
                    <rect x="16" y="20" width="28" height="30" rx="8" fill="#2A2421"/>
                    <rect x="23" y="25" width="14" height="8" rx="2" fill="#927519"/>
                    <circle cx="30" cy="16" r="16" fill="#2A2421"/>
                    <ellipse cx="33" cy="16" rx="10" ry="8" fill="#927519"/>
                    <path d="M 27 12 Q 33 10, 37 13" fill="none" stroke="#F4EFE6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                    <path d="M 18 26 C 10 30, 8 42, 14 46" fill="none" stroke="#2A2421" stroke-width="5" stroke-linecap="round"/>
                    <path d="M 42 26 C 52 32, 50 44, 44 48" fill="none" stroke="#2A2421" stroke-width="5" stroke-linecap="round"/>
                    <path d="M 22 48 C 18 58, 20 68, 16 74" fill="none" stroke="#2A2421" stroke-width="6" stroke-linecap="round"/>
                    <path d="M 38 48 C 42 58, 40 70, 46 76" fill="none" stroke="#2A2421" stroke-width="6" stroke-linecap="round"/>
                  </g>
                </svg>
              </div><p class="empty-404">404 not found</p></div>`
            : `<div class="empty-state"><div class="glyph"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px;"><path d="M3 6h11M3 12h7M3 18h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="19" cy="15" r="4.2" stroke="currentColor" stroke-width="1.5"/><path d="M19 13.2v3.6M17.2 15h3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div><p>Nothing logged yet. Add a session, a paper verdict, or a decision above.</p></div>`;
          return;
        }

        const tagBanner = activeTagFilter ? `<div class="tag-filter-banner">Filtered by tag: <strong>${escapeHtml(activeTagFilter)}</strong><button onclick="clearTagFilter()">Clear ×</button></div>` : '';

        // Milestones only apply to sessions. Split the (already newest-first) list
        // into segments each time a milestone entry is hit — that entry, plus every
        // older entry after it, belongs to its segment, until the next milestone.
        // Entries newer than the first milestone encountered sit in an unlabeled
        // segment at the top (nothing achieved yet). Note: date/month collapse
        // state is keyed by the plain date/month string, so if the same date ends
        // up split across two segments (a milestone mid-day), both instances share
        // one collapsed/expanded state — a rare edge case, not fully independent.
        const useMilestoneSegments = (activeFilter === 'session' && !activeTagFilter);
        let segments;
        if (useMilestoneSegments) {
          segments = [];
          let label = null;
          let bucket = [];
          filtered.forEach(e => {
            if (e.is_milestone) {
              segments.push({ label, entries: bucket });
              bucket = [];
              label = e.milestone_label || 'Milestone';
            }
            bucket.push(e);
          });
          segments.push({ label, entries: bucket });
          segments = segments.filter(s => s.entries.length > 0);
        } else {
          segments = [{ label: null, entries: filtered }];
        }

        // Flatten each segment's entries into consecutive same-date buckets, tagging
        // the first bucket of a labeled segment with the milestone divider it sits
        // below. This keeps one continuous month/week grouping across the whole
        // list — the divider only breaks the day-level flow, not month/week headings.
        const allBuckets = [];
        segments.forEach((seg, segIdx) => {
          seg.entries.forEach(e => {
            const dateKey = e.date || 'undated';
            const last = allBuckets[allBuckets.length - 1];
            if (last && last.dateKey === dateKey && last.segIdx === segIdx) {
              last.entries.push(e);
            } else {
              allBuckets.push({ dateKey, entries: [e], segIdx, dividerLabel: (allBuckets.length === 0 || last.segIdx !== segIdx) ? seg.label : null });
            }
          });
        });

        const monthCounts = {}, weekCounts = {};
        allBuckets.forEach(b => {
          const undated = b.dateKey === 'undated';
          const mk = undated ? 'undated' : monthKeyLabel(b.dateKey).key;
          const wk = undated ? 'undated' : weekKeyLabel(b.dateKey).key;
          monthCounts[mk] = (monthCounts[mk] || 0) + b.entries.length;
          if (!undated) weekCounts[wk] = (weekCounts[wk] || 0) + b.entries.length;
        });

        let lastMonthKey = null, lastWeekKey = null;
        let monthCollapsedActive = false, weekCollapsedActive = false, milestoneCollapsedActive = false;
        let bodyHtml = '';

        allBuckets.forEach(b => {
          const undated = b.dateKey === 'undated';
          const mk = undated ? 'undated' : monthKeyLabel(b.dateKey).key;
          const wk = undated ? 'undated' : weekKeyLabel(b.dateKey).key;

          if (mk !== lastMonthKey) {
            const monthLabel = undated ? 'Undated' : monthKeyLabel(b.dateKey).label;
            monthCollapsedActive = collapsedMonths.has(mk);
            bodyHtml += `
        <div class="month-heading" onclick="toggleMonth('${mk}')">
          <span class="chevron">${monthCollapsedActive ? '▸' : '▾'}</span>
          ${escapeHtml(monthLabel)}
          <span class="group-count">${monthCounts[mk]}</span>
        </div>`;
            lastMonthKey = mk;
            lastWeekKey = null;
          }

          if (!monthCollapsedActive && !undated && wk !== lastWeekKey) {
            const weekLabel = weekKeyLabel(b.dateKey).label;
            weekCollapsedActive = collapsedWeeks.has(wk);
            bodyHtml += `
        <div class="week-heading" onclick="toggleWeek('${wk}')">
          <span class="chevron">${weekCollapsedActive ? '▸' : '▾'}</span>
          ${escapeHtml(weekLabel)}
          <span class="group-count">${weekCounts[wk]}</span>
        </div>`;
            lastWeekKey = wk;
          }

          if (b.dividerLabel) {
            milestoneCollapsedActive = collapsedMilestones.has(String(b.segIdx));
            if (!monthCollapsedActive && !(!undated && weekCollapsedActive)) {
              bodyHtml += `
          <div class="milestone-divider" onclick="toggleMilestone('${b.segIdx}')">
            <span class="chevron">${milestoneCollapsedActive ? '▸' : '▾'}</span>
            <span class="line"></span><span class="milestone-divider-label">★ ${escapeHtml(b.dividerLabel)}</span><span class="line"></span>
          </div>`;
            }
          }

          if (monthCollapsedActive) return;
          if (!undated && weekCollapsedActive) return;
          if (milestoneCollapsedActive) return;

          const dayCollapsed = collapsedDays.has(b.dateKey);
          bodyHtml += `
      <div class="day-group">
        <div class="day-heading" onclick="toggleDay('${b.dateKey}')">
          <span class="chevron">${dayCollapsed ? '▸' : '▾'}</span>
          ${undated ? 'Undated' : fmtDate(b.dateKey)}
          <span class="group-count">${b.entries.length}</span>
        </div>
        ${dayCollapsed ? '' : b.entries.map(e => cardHtml(e, expandedIds.has(e.id))).join('')}
      </div>`;
        });

        timeline.innerHTML = tagBanner + bodyHtml;
      }

      function toggleWeek(key) {
        if (collapsedWeeks.has(key)) collapsedWeeks.delete(key); else collapsedWeeks.add(key);
        render();
      }
      window.toggleWeek = toggleWeek;

      function toggleMilestone(segIdx) {
        const key = String(segIdx);
        if (collapsedMilestones.has(key)) collapsedMilestones.delete(key); else collapsedMilestones.add(key);
        render();
      }
      window.toggleMilestone = toggleMilestone;

      function toggleMonth(key) {
        if (collapsedMonths.has(key)) collapsedMonths.delete(key); else collapsedMonths.add(key);
        render();
      }
      window.toggleMonth = toggleMonth;

      function toggleDay(key) {
        if (collapsedDays.has(key)) collapsedDays.delete(key); else collapsedDays.add(key);
        render();
      }
      window.toggleDay = toggleDay;

      function applyDefaultCollapse() {
        const allDates = [...new Set(entries.map(e => e.date).filter(Boolean))].sort().reverse();
        allDates.slice(1).forEach(d => collapsedDays.add(d));
        const allMonths = [...new Set(allDates.map(d => d.slice(0, 7)))].sort().reverse();
        allMonths.slice(1).forEach(m => collapsedMonths.add(m));
        const allWeeks = [...new Set(allDates.map(d => weekKeyLabel(d).key))].sort().reverse();
        allWeeks.slice(1).forEach(w => collapsedWeeks.add(w));
      }

      function renderStats() {
        const totalMinutes = entries.filter(e => e.type === 'session').reduce((sum, e) => sum + (e.duration || 0), 0);
        const hours = (totalMinutes / 60).toFixed(1);
        const accepted = entries.filter(e => e.type === 'paper' && e.verdict === 'accepted').length;
        const rejected = entries.filter(e => e.type === 'paper' && e.verdict === 'rejected').length;
        const decisions = entries.filter(e => e.type === 'decision').length;

        const lastDate = entries.reduce((max, e) => (e.date && e.date > max) ? e.date : max, '');
        let sinceLabel = '—', sinceStale = false;
        if (lastDate) {
          const d = new Date(lastDate + 'T00:00:00');
          const now = new Date(); now.setHours(0, 0, 0, 0);
          const days = Math.round((now - d) / 86400000);
          sinceLabel = days <= 0 ? 'Today' : days === 1 ? '1 day' : days + ' days';
          sinceStale = days > 6;
        }

        $('#stats').innerHTML = `
    <div class="stat"><span class="num">${hours}</span><span class="label">Hours logged</span></div>
    <div class="stat"><span class="num">${accepted}/${rejected}</span><span class="label">Papers acc/rej</span></div>
    <div class="stat"><span class="num">${decisions}</span><span class="label">Decisions</span></div>
    <div class="stat${sinceStale ? ' stat-warn' : ''}"><span class="num">${sinceLabel}</span><span class="label">Since last log</span></div>
  `;
      }

      function todoItemHtml(e, isDone) {
        return `
    <div class="todo-item">
      <button class="todo-check ${isDone ? 'checked' : ''}" onclick="toggleNextDone('${e.id}', ${!isDone})">${isDone ? '✓' : ''}</button>
      <div class="todo-text ${isDone ? 'done' : ''}"><span class="date">${fmtDate(e.date)}</span>${escapeHtml(e.next_step)}</div>
    </div>`;
      }

      function renderTodo() {
        const withSteps = entries.filter(e => e.type === 'session' && e.next_step && e.next_step.trim());
        const active = withSteps.filter(e => !e.next_done).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const done = withSteps.filter(e => e.next_done).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

        const list = document.getElementById('todo-list');
        if (!list) return;

        if (active.length === 0 && done.length === 0) {
          list.innerHTML = `<div class="todo-empty">No open questions logged yet — they'll show up here from a session's "Next step" field.</div>`;
        } else {
          let html = active.length ? active.map(e => todoItemHtml(e, false)).join('') : `<div class="todo-empty">All caught up.</div>`;
          if (done.length) {
            html += `<div class="todo-divider">Resolved</div>` + done.slice(0, 10).map(e => todoItemHtml(e, true)).join('');
          }
          list.innerHTML = html;
        }

        const toggle = document.getElementById('todo-toggle');
        let badgeEl = toggle.querySelector('.todo-badge');
        if (active.length > 0) {
          if (!badgeEl) { badgeEl = document.createElement('span'); badgeEl.className = 'todo-badge'; toggle.appendChild(badgeEl); }
          badgeEl.textContent = active.length;
        } else if (badgeEl) {
          badgeEl.remove();
        }
      }

      async function toggleNextDone(id, newVal) {
        const { data, error } = await supabaseClient.from('entries').update({ next_done: newVal }).eq('id', id).select();
        if (error) { showError('Could not update: ' + error.message); return; }
        entries = entries.map(x => x.id === id ? data[0] : x);
        render();
      }
      window.toggleNextDone = toggleNextDone;

      async function markCalendarAdded(id) {
        // Fallback path used only if Google Calendar isn't configured yet — just
        // opens the pre-filled template link and optimistically flags it as added,
        // with no real confirmation from Google.
        const e = entries.find(x => x.id === id);
        if (e && e.calendar_added) return;
        const { data, error } = await supabaseClient.from('entries').update({ calendar_added: true }).eq('id', id).select();
        if (error) return;
        entries = entries.map(x => x.id === id ? data[0] : x);
        render();
      }
      window.markCalendarAdded = markCalendarAdded;



      async function getFreshAccessToken() {
        const res = await fetch('/api/get-calendar-token');
        const data = await res.json();
        if (!data.access_token) throw new Error(data.error || 'Calendar not authorized — run the one-time setup');
        return data.access_token;
      }

      async function addToGoogleCalendar(id) {
        const e = entries.find(x => x.id === id);
        if (!e) return;

        try {
          const token = await getFreshAccessToken();
          await createCalendarEvent(e, token);
        } catch (err) {
          showError('Could not add to Calendar: ' + err.message);
        }
      }
      window.addToGoogleCalendar = addToGoogleCalendar;

      async function unlinkCalendarEvent(id) {
        const e = entries.find(x => x.id === id);
        if (!e) return;

        if (e.calendar_event_id) {
          try {
            const token = await getFreshAccessToken();
            await reallyDeleteCalendarEvent(e, token);
            return;
          } catch (err) {
            showError('Could not authorize deletion: ' + err.message);
            return;
          }
        }
        // fallback: no event id stored (older entry) — just clear locally
        await clearCalendarFields(id);
      }

      async function reallyDeleteCalendarEvent(e, token) {
        try {
          const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${e.calendar_event_id}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (!res.ok && res.status !== 410) { // 410 = already deleted on Google's side, treat as success
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error?.message || 'Calendar API error');
          }
        } catch (err) {
          showError('Could not delete from Calendar (removing local link anyway): ' + err.message);
        }
        await clearCalendarFields(e.id);
      }

      async function clearCalendarFields(id) {
        const { data, error } = await supabaseClient.from('entries')
          .update({ calendar_added: false, calendar_event_link: null, calendar_event_id: null })
          .eq('id', id).select();
        if (error) { showError('Could not unlink locally: ' + error.message); return; }
        entries = entries.map(x => x.id === id ? data[0] : x);
        render();
      }
      window.unlinkCalendarEvent = unlinkCalendarEvent;

      async function createCalendarEvent(e, token) {
        const body = buildCalendarEventBody(e);

        try {
          const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || 'Calendar API error');

          const { data: updated, error } = await supabaseClient.from('entries')
            .update({ calendar_added: true, calendar_event_link: data.htmlLink, calendar_event_id: data.id })
            .eq('id', e.id).select();
          if (error) { showError('Event created in Calendar, but could not save the link locally: ' + error.message); return; }
          entries = entries.map(x => x.id === e.id ? updated[0] : x);
          render();
        } catch (err) {
          showError('Could not create the calendar event: ' + err.message);
        }
      }

      function buildCalendarEventBody(e) {
        const summary = (e.summary || 'Research session').slice(0, 80);
        let description = e.summary || '';
        if (e.link) description += '\n\nLink: ' + e.link;
        if (e.next_step) description += '\n\nOpen question: ' + e.next_step;
        const body = { summary, description };
        if (e.time) {
          const start = new Date(`${e.date}T${e.time}:00`);
          const durMin = e.duration || 60;
          const end = new Date(start.getTime() + durMin * 60000);
          const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
          body.start = { dateTime: start.toISOString(), timeZone: tz };
          body.end = { dateTime: end.toISOString(), timeZone: tz };
        } else if (e.date) {
          const d1 = new Date(e.date + 'T00:00:00'); d1.setDate(d1.getDate() + 1);
          body.start = { date: e.date };
          body.end = { date: d1.toISOString().slice(0, 10) };
        }
        return body;
      }

      // Pushes edits (summary, link, next step, date/time) to an already-linked
      // Google Calendar event. If the event has been deleted or moved on Google's
      // side, unlinks it locally instead of leaving a stale "Synced" badge that
      // points nowhere.
      async function updateCalendarEvent(e, token) {
        const body = buildCalendarEventBody(e);
        const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${e.calendar_event_id}`, {
          method: 'PATCH',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (res.status === 404 || res.status === 410) {
          await clearCalendarFields(e.id);
          showError('The linked Calendar event no longer exists — unlinked locally. Use "Add to Google Calendar" to create a fresh one.');
          return;
        }

        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'Calendar API error');

        const { data: updated, error } = await supabaseClient.from('entries')
          .update({ calendar_event_link: data.htmlLink })
          .eq('id', e.id).select();
        if (!error && updated?.[0]) {
          entries = entries.map(x => x.id === e.id ? updated[0] : x);
          render();
        }
      }

      async function syncCalendarEventUpdate(e) {
        const msgEl = document.getElementById('msg-session');
        try {
          const token = await getFreshAccessToken();
          await updateCalendarEvent(e, token);
          if (msgEl) { msgEl.textContent = 'Updated · synced to Calendar'; setTimeout(() => msgEl.textContent = '', 2000); }
        } catch (err) {
          if (msgEl) { msgEl.textContent = 'Updated (Calendar sync failed)'; setTimeout(() => msgEl.textContent = '', 2500); }
          showError('Could not sync changes to Calendar: ' + err.message);
        }
      }

      async function checkForNewCalendarEvents() {
        const btn = document.getElementById('cal-check-btn');
        btn.disabled = true;
        btn.textContent = 'Checking…';
        try {
          const res = await fetch('/api/check-calendar-events');
          const data = await res.json();
          if (!data.ok) { showError('Calendar check failed: ' + (data.error || 'unknown error')); return; }
          await loadPendingCalendarEvents();
        } catch (err) {
          showError('Calendar check failed: ' + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Check for new events';
        }
      }
      document.getElementById('cal-check-btn').addEventListener('click', checkForNewCalendarEvents);

      async function loadPendingCalendarEvents() {
        const { data, error } = await supabaseClient
          .from('calendar_review_queue')
          .select('*')
          .eq('status', 'pending')
          .order('start_time', { ascending: true });

        const panel = document.getElementById('pending-cal-panel');
        const list = document.getElementById('pending-cal-list');

        if (error) {
          showError('Could not load pending calendar events: ' + error.message);
          return;
        }

        pendingCalEvents = data || [];

        if (pendingCalEvents.length === 0) {
          list.innerHTML = '<div style="font-family:var(--sans); font-size:12.5px; color:var(--muted, #888); padding:4px 8px;">No pending events right now.</div>';
          return;
        }

        list.innerHTML = pendingCalEvents.map(ev => {
          const start = ev.start_time ? new Date(ev.start_time).toLocaleString() : '(no start time)';
          const end = ev.end_time ? new Date(ev.end_time).toLocaleString() : '';
          return `
      <div class="pending-cal-row" style="border:1px solid var(--line); border-radius:var(--radius); padding:10px; margin-bottom:8px;">
        <div style="font-family:var(--sans); font-size:13.5px; color:var(--ink); font-weight:600;">${escapeHtml(ev.title || '(no title)')}</div>
        <div style="font-family:var(--sans); font-size:12px; color:var(--muted, #888); margin:4px 0;">${escapeHtml(start)}${end ? ' → ' + escapeHtml(end) : ''}</div>
        ${ev.description ? `<div style="font-family:var(--sans); font-size:12.5px; white-space:pre-wrap; margin-bottom:8px;">${escapeHtml(ev.description)}</div>` : ''}
        <button class="cal-link cal-btn" onclick="reviewCalendarEvent('${ev.id}', 'approve')">✓ Approve → add as session</button>
        <button class="cal-link cal-btn" onclick="reviewCalendarEvent('${ev.id}', 'reject')" style="margin-left:6px;">✕ Reject</button>
      </div>`;
        }).join('');
      }

      async function reviewCalendarEvent(id, action) {
        try {
          let body = { id, action };

          if (action === 'approve') {
            const ev = pendingCalEvents.find(x => x.id === id);
            if (ev && ev.start_time) {
              const start = new Date(ev.start_time);
              const pad = n => String(n).padStart(2, '0');
              const localDate = `${start.getFullYear()}-${pad(start.getMonth() + 1)}-${pad(start.getDate())}`;
              const localTime = `${pad(start.getHours())}:${pad(start.getMinutes())}`;
              let duration = null;
              if (ev.end_time) {
                const end = new Date(ev.end_time);
                duration = Math.round((end - start) / 60000);
              }
              body.date = localDate;
              body.time = localTime;
              body.duration = duration;
            }
          }

          const res = await fetch('/api/review-calendar-event', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await res.json();
          if (!data.ok) { showError('Could not ' + action + ' event: ' + (data.error || 'unknown error')); return; }
          await loadPendingCalendarEvents();
          if (action === 'approve') await loadEntries(); // refresh Sessions tab to show the newly added entry
        } catch (err) {
          showError('Could not ' + action + ' event: ' + err.message);
        }
      }
      window.reviewCalendarEvent = reviewCalendarEvent;

      // ---------- Recap & Export ----------

      function recapEntrySummary(e) {
        if (e.type === 'session') return e.summary || '(no summary)';
        if (e.type === 'paper') return e.title || '(untitled paper)';
        if (e.type === 'decision') return e.decision || '(untitled decision)';
        if (e.type === 'account') return e.title || '(untitled)';
        return '';
      }

      function recapEntryDetail(e) {
        const lines = [];
        if (e.type === 'session') {
          if (e.is_milestone) lines.push('★ Milestone: ' + (e.milestone_label || ''));
          if (e.next_step) lines.push('Next step: ' + e.next_step);
        }
        if (e.type === 'paper') {
          const verdictLabel = e.verdict === 'accepted' ? 'Accepted' : e.verdict === 'rejected' ? 'Rejected' : e.verdict === 'related-work' ? 'Related work' : e.verdict === 'alternate' ? 'Alternate' : 'Extendable';
          lines.push('Verdict: ' + verdictLabel);
          if (e.reason) lines.push(e.reason);
        }
        if (e.type === 'decision') {
          if (e.rationale) lines.push('Rationale: ' + e.rationale);
          if (e.alternatives) lines.push('Alternatives considered: ' + e.alternatives);
          if (e.outcome) {
            const outcomeMap = { holding: 'Holding up', partial: 'Partially validated', reversed: 'Reversed', superseded: 'Superseded', invalidated: 'Invalidated by evidence' };
            lines.push('Outcome: ' + (outcomeMap[e.outcome] || e.outcome));
          }
          if (e.outcome_reason) lines.push('Reason: ' + e.outcome_reason);
        }
        if (e.type === 'account') {
          if (e.reason) lines.push(e.reason);
        }
        return lines;
      }

      function resolveRecapEntries(scope, fromDate, toDate) {
        const sorted = [...entries].sort((a, b) => (a.created_at || '').localeCompare(b.created_at || '') || (a.date || '').localeCompare(b.date || ''));

        if (scope === 'since-last-session') {
          const sessions = sorted.filter(e => e.type === 'session');
          if (sessions.length < 2) return sorted;
          const cutoff = sessions[sessions.length - 2].created_at || '';
          return sorted.filter(e => (e.created_at || '') > cutoff);
        }
        if (scope === 'since-last-milestone') {
          const milestones = sorted.filter(e => e.is_milestone);
          if (milestones.length === 0) return sorted;
          const cutoff = milestones[milestones.length - 1].created_at || '';
          return sorted.filter(e => (e.created_at || '') >= cutoff);
        }
        if (scope === 'last-7' || scope === 'last-30') {
          const days = scope === 'last-7' ? 7 : 30;
          const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days); cutoff.setHours(0, 0, 0, 0);
          const cutoffStr = cutoff.toISOString().slice(0, 10);
          return sorted.filter(e => (e.date || '') >= cutoffStr);
        }
        if (scope === 'daterange') {
          return sorted.filter(e => (!fromDate || (e.date || '') >= fromDate) && (!toDate || (e.date || '') <= toDate));
        }
        return sorted; // 'all'
      }

      function selectedRecapTypes() {
        return [...document.querySelectorAll('.recap-type-check:checked')].map(c => c.value);
      }

      function selectedFromGroup(selector) {
        const boxes = [...document.querySelectorAll(selector)];
        const all = boxes.find(b => b.value === 'all');
        if (all && all.checked) return null; // null = no filter, everything passes
        return boxes.filter(b => b.value !== 'all' && b.checked).map(b => b.value);
      }

      function entryHasLinkType(e, type) {
        if (e['linked_' + type + '_id']) return true;
        const arr = e['linked_' + type + '_ids'];
        return Array.isArray(arr) && arr.length > 0;
      }

      function recapPassesSubfilters(e) {
        if (e.type === 'session') {
          const milestones = selectedFromGroup('.recap-milestonefilter');
          if (milestones && !milestones.includes(e.is_milestone ? 'milestone' : 'non-milestone')) return false;
        }
        if (e.type === 'paper') {
          const verdicts = selectedFromGroup('.recap-verdictfilter');
          if (verdicts && !verdicts.includes(e.verdict)) return false;
        }
        if (e.type === 'decision') {
          const outcomes = selectedFromGroup('.recap-outcomefilter');
          if (outcomes && !outcomes.includes(e.outcome || '')) return false;
        }
        const linkFilter = selectedFromGroup(`.recap-linkfilter[data-scope="${e.type}"]`);
        if (linkFilter) {
          if (linkFilter.length === 0) return false;
          if (!linkFilter.some(t => entryHasLinkType(e, t))) return false;
        }
        return true;
      }

      function wireRecapExclusiveGroup(selector) {
        const boxes = [...document.querySelectorAll(selector)];
        boxes.forEach(b => {
          b.addEventListener('change', () => {
            if (b.value === 'all') {
              if (b.checked) boxes.forEach(o => { if (o.value !== 'all') o.checked = false; });
            } else if (b.checked) {
              const all = boxes.find(o => o.value === 'all');
              if (all) all.checked = false;
            } else if (!boxes.some(o => o.value !== 'all' && o.checked)) {
              const all = boxes.find(o => o.value === 'all');
              if (all) all.checked = true;
            }
            updateRdropLabel(selector);
            updateRecapFiltersBadge();
            renderRecap();
          });
        });
        updateRdropLabel(selector);
        updateRecapFiltersBadge();
      }

      // Compact dropdown-pill filters (Links to / Verdict / Outcome) — click to open,
      // click outside to close, and the button shows a live "x/y" count when narrowed.
      function initRdrops() {
        document.querySelectorAll('[data-rdrop]').forEach(d => {
          const btn = d.querySelector('.rdrop-btn');
          if (!btn || btn._rdropWired) return;
          btn._rdropWired = true;
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const wasOpen = d.classList.contains('open');
            document.querySelectorAll('[data-rdrop].open').forEach(o => o.classList.remove('open'));
            if (!wasOpen) d.classList.add('open');
          });
          d.querySelector('.rdrop-panel')?.addEventListener('click', (e) => e.stopPropagation());
        });
      }
      document.addEventListener('click', () => {
        document.querySelectorAll('[data-rdrop].open').forEach(o => o.classList.remove('open'));
      });

      function updateRdropLabel(groupSelector) {
        const boxes = [...document.querySelectorAll(groupSelector)];
        if (!boxes.length) return;
        const drop = boxes[0].closest('[data-rdrop]');
        if (!drop) return;
        const labelEl = drop.querySelector('.rdrop-label');
        if (!labelEl.dataset.base) labelEl.dataset.base = labelEl.textContent;
        const base = labelEl.dataset.base;
        const all = boxes.find(b => b.value === 'all');
        const others = all ? boxes.filter(b => b.value !== 'all') : boxes;
        const checkedOthers = others.filter(b => b.checked);
        const fullySelected = all ? (all.checked || checkedOthers.length === 0) : (checkedOthers.length === others.length);
        let countEl = drop.querySelector('.rdrop-count');
        labelEl.textContent = base;
        if (fullySelected) {
          if (countEl) countEl.remove();
        } else {
          if (!countEl) {
            countEl = document.createElement('span');
            countEl.className = 'rdrop-count';
            labelEl.insertAdjacentElement('afterend', countEl);
          }
          countEl.textContent = `${checkedOthers.length}/${others.length}`;
        }
      }

      // Filters drawer (Links to / Verdict / Outcome) — opened via the ⚙ icon.
      function openRecapFiltersDrawer() {
        document.getElementById('recap-filters-drawer').classList.add('open');
        document.getElementById('recap-filters-backdrop').classList.add('open');
      }
      function closeRecapFiltersDrawer() {
        document.getElementById('recap-filters-drawer').classList.remove('open');
        document.getElementById('recap-filters-backdrop').classList.remove('open');
      }
      function updateRecapFiltersBadge() {
        const groups = ['.recap-milestonefilter', '.recap-verdictfilter', '.recap-outcomefilter',
          '.recap-linkfilter[data-scope="session"]', '.recap-linkfilter[data-scope="paper"]',
          '.recap-linkfilter[data-scope="decision"]', '.recap-linkfilter[data-scope="account"]'];
        const narrowedCount = groups.filter(sel => {
          const boxes = [...document.querySelectorAll(sel)];
          if (!boxes.length) return false;
          const all = boxes.find(b => b.value === 'all');
          return all && !all.checked;
        }).length;
        const btn = document.getElementById('recap-filters-toggle');
        const badge = document.getElementById('recap-filters-badge');
        btn.classList.toggle('has-active', narrowedCount > 0);
        if (badge) {
          badge.style.display = narrowedCount > 0 ? 'inline' : 'none';
          badge.textContent = narrowedCount;
        }
      }

      function renderRecap() {
        const { scope, fromDate, toDate } = recapScopeState;
        const types = selectedRecapTypes();
        ['session', 'paper', 'decision', 'account'].forEach(t => {
          const el = document.getElementById('recap-subfilter-' + t);
          if (el) el.style.display = types.includes(t) ? 'flex' : 'none';
        });
        const scoped = resolveRecapEntries(scope, fromDate, toDate)
          .filter(e => types.includes(e.type))
          .filter(recapPassesSubfilters);
        document.getElementById('recap-ai-panel').style.display = 'none';

        const list = $('#recap-list');
        if (scoped.length === 0) {
          list.innerHTML = `<div class="recap-empty">Nothing in this range.</div>`;
          return;
        }

        let lastDate = null;
        list.innerHTML = scoped.map(e => {
          const dateChanged = e.date !== lastDate;
          lastDate = e.date;
          const detailLines = recapEntryDetail(e);
          const typeLabel = e.type.charAt(0).toUpperCase() + e.type.slice(1);
          return `
      ${dateChanged ? `<div class="recap-day">${e.date ? fmtDate(e.date) : 'Undated'}</div>` : ''}
      <div class="recap-entry" onclick="document.getElementById('archive-modal').classList.remove('open'); jumpToEntry('${e.id}');">
        <div class="recap-entry-top"><span class="recap-entry-type">${typeLabel}</span><div class="recap-entry-title">${escapeHtml(recapEntrySummary(e))}</div></div>
        ${detailLines.length ? `<div class="recap-entry-detail">${detailLines.map(l => `<div class="recap-entry-line">${escapeHtml(l)}</div>`).join('')}</div>` : ''}
      </div>`;
        }).join('');
      }

      function recapScopeLabel() {
        const { scope, fromDate, toDate } = recapScopeState;
        if (scope === 'daterange') {
          if (fromDate && toDate && fromDate !== toDate) return `Recap — ${fmtDate(fromDate)} to ${fmtDate(toDate)}`;
          if (fromDate) return `Recap — ${fmtDate(fromDate)}`;
          return 'Recap — custom range';
        }
        const map = {
          'since-last-session': 'Recap since last session',
          'since-last-milestone': 'Recap since last milestone',
          'last-7': 'Recap — last 7 days',
          'last-30': 'Recap — last 30 days',
          'all': 'Full research log'
        };
        return map[scope] || 'Recap';
      }

      function buildRecapText(markdown) {
        const { scope, fromDate, toDate } = recapScopeState;
        const types = selectedRecapTypes();
        const scoped = resolveRecapEntries(scope, fromDate, toDate).filter(e => types.includes(e.type));
        const title = recapScopeLabel();

        let out = markdown ? `# ${title}\n\n` : `${title}\n${'='.repeat(title.length)}\n\n`;
        if (scoped.length === 0) return out + '(Nothing in this range.)\n';

        let lastDate = null;
        scoped.forEach(e => {
          if (e.date !== lastDate) {
            lastDate = e.date;
            out += markdown ? `\n## ${e.date ? fmtDate(e.date) : 'Undated'}\n\n` : `\n${e.date ? fmtDate(e.date) : 'Undated'}\n${'-'.repeat(20)}\n`;
          }
          const typeLabel = e.type.toUpperCase();
          out += markdown ? `**${typeLabel}:** ${recapEntrySummary(e)}\n` : `[${typeLabel}] ${recapEntrySummary(e)}\n`;
          recapEntryDetail(e).forEach(line => { out += (markdown ? `- ${line}\n` : `  ${line}\n`); });
          out += '\n';
        });
        return out;
      }

      const ollamaModelInput = document.getElementById('ollama-model-input');
      try { ollamaModelInput.value = localStorage.getItem('fieldlog-ollama-model') || ''; } catch (e) { }
      ollamaModelInput.addEventListener('change', () => {
        try { localStorage.setItem('fieldlog-ollama-model', ollamaModelInput.value.trim()); } catch (e) { }
      });

      document.getElementById('context-toggle').addEventListener('click', () => {
        const panel = document.getElementById('context-panel');
        const isOpen = panel.style.display === 'block';
        panel.style.display = isOpen ? 'none' : 'block';
        if (!isOpen) document.getElementById('context-textarea').value = projectContext;
      });

      document.getElementById('context-save-btn').addEventListener('click', async () => {
        const btn = document.getElementById('context-save-btn');
        const text = document.getElementById('context-textarea').value.trim();
        btn.textContent = 'Saving…';
        const ok = await saveProjectContext(text);
        btn.textContent = ok ? 'Saved' : 'Save context';
        if (ok) setTimeout(() => { btn.textContent = 'Save context'; }, 1500);
      });

      // Compact date-range control (replaces the old scope <select> + milestone pickers)
      let recapScopeState = { scope: 'since-last-session', fromDate: null, toDate: null };
      const recapCal = { y: new Date().getFullYear(), m: new Date().getMonth(), start: null, end: null };

      const RECAP_PRESET_LABELS = {
        'since-last-session': 'Since last session',
        'since-last-milestone': 'Since last milestone',
        'last-7': 'Last 7 days',
        'last-30': 'Last 30 days',
        'all': 'Entire log'
      };

      function applyRecapScope(scope, fromDate, toDate) {
        recapScopeState = { scope, fromDate: fromDate || null, toDate: toDate || null };
        updateRecapDateLabel();
        document.querySelectorAll('.drp-preset').forEach(b => b.classList.toggle('active', b.dataset.preset === scope));
        renderRecap();
      }

      function updateRecapDateLabel() {
        const el = document.getElementById('recap-date-label');
        if (!el) return;
        const { scope, fromDate, toDate } = recapScopeState;
        if (scope === 'daterange' && fromDate) {
          el.textContent = (toDate && toDate !== fromDate) ? `${fmtDate(fromDate)} – ${fmtDate(toDate)}` : fmtDate(fromDate);
        } else {
          el.textContent = RECAP_PRESET_LABELS[scope] || 'Entire log';
        }
      }

      function drpRenderCalendar() {
        const grid = document.getElementById('drp-cal-grid');
        if (!grid) return;
        const first = new Date(recapCal.y, recapCal.m, 1);
        const startDow = first.getDay();
        const daysInMonth = new Date(recapCal.y, recapCal.m + 1, 0).getDate();
        const daysInPrevMonth = new Date(recapCal.y, recapCal.m, 0).getDate();
        document.getElementById('drp-cal-title').textContent = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
        const dow = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        let cells = dow.map(d => `<div class="drp-dow">${d}</div>`).join('');
        for (let i = startDow - 1; i >= 0; i--) cells += `<div class="drp-day out">${daysInPrevMonth - i}</div>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${recapCal.y}-${String(recapCal.m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          let cls = 'drp-day';
          if (recapCal.start && iso === recapCal.start) cls += ' range-start';
          if (recapCal.end && iso === recapCal.end) cls += ' range-end';
          if (recapCal.start && recapCal.end && iso > recapCal.start && iso < recapCal.end) cls += ' in-range';
          if (!recapCal.end && recapCal.start && iso === recapCal.start) cls += ' range-end';
          cells += `<div class="${cls}" data-date="${iso}">${d}</div>`;
        }
        const trailing = (7 - ((startDow + daysInMonth) % 7)) % 7;
        for (let d = 1; d <= trailing; d++) cells += `<div class="drp-day out">${d}</div>`;
        grid.innerHTML = cells;
        grid.querySelectorAll('.drp-day:not(.out)').forEach(el => {
          el.addEventListener('click', () => drpPickDate(el.dataset.date));
        });
      }

      function drpPickDate(iso) {
        if (!recapCal.start || (recapCal.start && recapCal.end)) {
          recapCal.start = iso; recapCal.end = null;
        } else if (iso < recapCal.start) {
          recapCal.end = recapCal.start; recapCal.start = iso;
        } else {
          recapCal.end = iso;
        }
        document.querySelectorAll('.drp-preset').forEach(b => b.classList.remove('active'));
        drpRenderCalendar();
        drpUpdateSummary();
      }

      function drpUpdateSummary() {
        const el = document.getElementById('drp-range-summary');
        if (!el) return;
        if (recapCal.start && recapCal.end) el.textContent = `${fmtDate(recapCal.start)} – ${fmtDate(recapCal.end)}`;
        else if (recapCal.start) el.textContent = `${fmtDate(recapCal.start)} — pick an end date`;
        else el.textContent = 'Pick a start and end date';
      }

      document.getElementById('drp-prev')?.addEventListener('click', () => {
        recapCal.m--; if (recapCal.m < 0) { recapCal.m = 11; recapCal.y--; } drpRenderCalendar();
      });
      document.getElementById('drp-next')?.addEventListener('click', () => {
        recapCal.m++; if (recapCal.m > 11) { recapCal.m = 0; recapCal.y++; } drpRenderCalendar();
      });
      document.querySelectorAll('.drp-preset').forEach(btn => {
        btn.addEventListener('click', () => {
          recapCal.start = null; recapCal.end = null;
          drpRenderCalendar(); drpUpdateSummary();
          applyRecapScope(btn.dataset.preset, null, null);
          document.getElementById('recap-date-drop')?.classList.remove('open');
        });
      });
      document.getElementById('drp-apply')?.addEventListener('click', () => {
        if (recapCal.start) {
          applyRecapScope('daterange', recapCal.start, recapCal.end || recapCal.start);
          document.getElementById('recap-date-drop')?.classList.remove('open');
        }
      });
      drpRenderCalendar();
      drpUpdateSummary();
      updateRecapDateLabel();

      document.querySelectorAll('.recap-type-check').forEach(c => c.addEventListener('change', () => {
        updateRdropLabel('.recap-type-check');
        renderRecap();
      }));
      updateRdropLabel('.recap-type-check');
      wireRecapExclusiveGroup('.recap-milestonefilter');
      wireRecapExclusiveGroup('.recap-verdictfilter');
      wireRecapExclusiveGroup('.recap-outcomefilter');
      ['session', 'paper', 'decision', 'account'].forEach(scope => {
        wireRecapExclusiveGroup(`.recap-linkfilter[data-scope="${scope}"]`);
      });

      document.getElementById('recap-filters-toggle').addEventListener('click', openRecapFiltersDrawer);
      document.getElementById('recap-filters-close').addEventListener('click', closeRecapFiltersDrawer);
      document.getElementById('recap-filters-backdrop').addEventListener('click', closeRecapFiltersDrawer);
      initRdrops();

      document.getElementById('archive-toggle').addEventListener('click', async () => {
        document.getElementById('archive-modal').classList.add('open');
        setArchiveModalGroup('archive');
        switchArchiveTab('gallery');
        loadGallery();
        await loadRoadmap();
        refreshGalleryLinkDropdowns();
      });
      document.getElementById('progress-toggle').addEventListener('click', async () => {
        document.getElementById('archive-modal').classList.add('open');
        setArchiveModalGroup('progress');
        switchArchiveTab('roadmap');
        loadGallery();
        await loadRoadmap();
        refreshGalleryLinkDropdowns();
      });
      document.getElementById('archive-close').addEventListener('click', () => {
        document.getElementById('archive-modal').classList.remove('open');
      });
      document.getElementById('archive-modal').addEventListener('click', (ev) => {
        if (ev.target.id === 'archive-modal') document.getElementById('archive-modal').classList.remove('open');
      });

      const ARCHIVE_TABS = ['gallery', 'roadmap', 'connections', 'export'];
      const ARCHIVE_TAB_GROUPS = { gallery: 'archive', export: 'archive', roadmap: 'progress', connections: 'progress' };
      function setArchiveModalGroup(group) {
        document.querySelectorAll('.archive-tab').forEach(t => {
          t.style.display = (t.dataset.group === group) ? '' : 'none';
        });
      }
      function switchArchiveTab(which) {
        document.querySelectorAll('.archive-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === which));
        ARCHIVE_TABS.forEach(t => {
          document.getElementById('archive-tab-' + t).style.display = (t === which) ? 'block' : 'none';
        });
        if (which === 'connections') renderGraph();
        if (which === 'export') { renderRecap(); }
        if (which === 'roadmap') renderRoadmapVisual();
      }
      window.switchArchiveTab = switchArchiveTab;

      document.querySelectorAll('.archive-tab').forEach(tab => {
        tab.addEventListener('click', () => switchArchiveTab(tab.dataset.tab));
      });

      document.getElementById('gallery-upload-close').addEventListener('click', () => {
        document.getElementById('gallery-upload-popover').classList.remove('open');
      });
      document.getElementById('gallery-upload-popover').addEventListener('click', (e) => {
        if (e.target.id === 'gallery-upload-popover') e.currentTarget.classList.remove('open');
      });

      function refreshGalleryLinkDropdowns() {
        const roadmapOpts = roadmapItems.slice().sort((a, b) => (a.event_date || '').localeCompare(b.event_date || ''))
          .map(it => ({ id: it.id, label: it.node_title || it.title || 'Untitled node' }));
        if (multiLinkRegistry['gallery-linked-roadmap']) {
          multiLinkRegistry['gallery-linked-roadmap'].setOptions(roadmapOpts);
        } else {
          const roadmapSel = document.getElementById('gallery-linked-roadmap');
          if (roadmapSel) {
            const cur = roadmapSel.value;
            roadmapSel.innerHTML = '<option value="">— none —</option>' +
              roadmapOpts.map(o => `<option value="${o.id}">${escapeHtml(o.label)}</option>`).join('');
            roadmapSel.value = cur;
          }
        }
        const decisionOpts = entries.filter(e => e.type === 'decision').slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))
          .map(e => ({ id: e.id, label: e.decision || '(untitled decision)' }));
        if (multiLinkRegistry['gallery-linked-decision']) {
          multiLinkRegistry['gallery-linked-decision'].setOptions(decisionOpts);
        } else {
          const decisionSel = document.getElementById('gallery-linked-decision');
          if (decisionSel) {
            const cur = decisionSel.value;
            decisionSel.innerHTML = '<option value="">— none —</option>' +
              decisionOpts.map(o => `<option value="${o.id}">${escapeHtml(o.label)}</option>`).join('');
            decisionSel.value = cur;
          }
        }
      }

      function galleryLinkedBadge(item) {
        const roadmapIds = [...new Set([
          ...(item.linked_roadmap_id ? [item.linked_roadmap_id] : []),
          ...(Array.isArray(item.linked_roadmap_ids) ? item.linked_roadmap_ids : [])
        ])];
        const decisionIds = [...new Set([
          ...(item.linked_decision_id ? [item.linked_decision_id] : []),
          ...(Array.isArray(item.linked_decision_ids) ? item.linked_decision_ids : [])
        ])];
        const roadmapBadges = roadmapIds.map(id => roadmapItems.find(it => it.id === id)).filter(Boolean)
          .map(node => `<div class="gallery-item-linked" onclick="jumpToGalleryRoadmapNode('${node.id}')">↳ ${escapeHtml(node.node_title || node.title || 'Roadmap node')} →</div>`);
        const decisionBadges = decisionIds.map(id => entries.find(e => e.id === id)).filter(Boolean)
          .map(dec => `<div class="gallery-item-linked" onclick="jumpToGalleryDecision('${dec.id}')">↳ ${escapeHtml(dec.decision || 'Decision')} →</div>`);
        return roadmapBadges.concat(decisionBadges).join('');
      }

      function jumpToGalleryRoadmapNode(id) {
        document.getElementById('archive-modal').classList.add('open');
        setArchiveModalGroup('progress');
        switchArchiveTab('roadmap');
        openRoadmapPanel(id);
      }
      window.jumpToGalleryRoadmapNode = jumpToGalleryRoadmapNode;

      function jumpToGalleryDecision(id) {
        document.getElementById('archive-modal').classList.remove('open');

    hole.setAttribute('cx', 12); hole.setAttribute('cy', 9); hole.setAttribute('r', 2.6);

const ROADMAP_STATUS_LABELS = { done: 'Done', in_progress: 'In progress', blocked: 'Blocked', abandoned: 'Abandoned' };

// Small line-icons (24x24 lucide-style coordinate space) drawn inside each node
// circle, one per node type — clearer at a glance than a text glyph.
function buildRoadmapTypeIcon(svgns, typeKey) {
  const g = document.createElementNS(svgns, 'g');
  g.setAttribute('stroke', '#fff');
  g.setAttribute('stroke-width', '2');
  g.setAttribute('fill', 'none');
  g.setAttribute('stroke-linecap', 'round');
  g.setAttribute('stroke-linejoin', 'round');
  const mk = (tag, attrs) => {
    const el = document.createElementNS(svgns, tag);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
    g.appendChild(el);
  };
  switch (typeKey) {
    case 'milestone': // flag
      mk('path', { d: 'M5 21V4h13l-3 4 3 4H5' });
      break;
    case 'finding': // magnifying glass
      mk('circle', { cx: 10, cy: 10, r: 6, fill: 'none' });
      mk('line', { x1: 14.5, y1: 14.5, x2: 20, y2: 20 });
      break;
    case 'tuning': // wrench
      mk('path', { d: 'M15 6.5a4.5 4.5 0 0 1-5.7 4.33L4.5 15.6a1.7 1.7 0 0 0 2.4 2.4l4.77-4.8A4.5 4.5 0 0 0 17.5 8.5l-2.83 2.83-2-2L15.5 6.5H15z' });
      break;
    case 'decision-linked': // branch
      mk('line', { x1: 7, y1: 3, x2: 7, y2: 13 });
      mk('circle', { cx: 17, cy: 6, r: 2.8 });
      mk('circle', { cx: 7, cy: 18, r: 2.8 });
      mk('path', { d: 'M17 8.8A7 7 0 0 1 10 15.5' });
      break;
    case 'dead-end': // barrier X
      mk('line', { x1: 6, y1: 6, x2: 18, y2: 18 });
      mk('line', { x1: 6, y1: 18, x2: 18, y2: 6 });
      break;
    default:
      mk('circle', { cx: 12, cy: 12, r: 3, fill: '#fff', stroke: 'none' });
  }
  g.setAttribute('transform', 'scale(0.5) translate(-12,-12)');
  return g;
}

      function renderRoadmapVisual() {
        let svg = document.getElementById('roadmap-svg');
        const emptyMsg = document.getElementById('roadmap-empty-msg');
        svg.innerHTML = '';

        emptyMsg.style.display = roadmapItems.length === 0 ? 'block' : 'none';

        const combined = [
          { id: 'anchor-start', anchor: true, key: 'start', title: roadmapAnchors.start.title || 'Start', choice: roadmapAnchors.start.choice, rationale: roadmapAnchors.start.rationale },
          ...roadmapItems,
          { id: 'anchor-end', anchor: true, key: 'end', title: roadmapAnchors.end.title || 'Now', choice: roadmapAnchors.end.choice, rationale: roadmapAnchors.end.rationale }
        ];

        // This is a progress trace, not a forward-looking plan — so the spine is a
        // straight, scrollable vertical line in chronological order. Dead-ends are
        // real detours: they branch off the spine to a stub and stop, they don't
        // bend the main line. No zoom/pan — a linear sequence just scrolls.
        const mainline = combined.filter(it => it.anchor || it.node_type !== 'dead-end');
        const deadends = combined.filter(it => !it.anchor && it.node_type === 'dead-end');

        const wrapEl = document.getElementById('roadmap-svg-wrap');
        if (wrapEl.offsetParent === null) return;
        const totalW = Math.max(480, (wrapEl.clientWidth || 700) - 16);
        const centerX = totalW / 2, padY = 54, stepY = 150;
        const cardW = 160, cardGap = 14, nodeR = 13;
        const branchOffset = Math.min(110, Math.max(70, centerX - nodeR - cardGap - cardW - 20));
        const branchStepY = 44;

        const mpts = mainline.map((item, i) => ({ x: centerX, y: padY + i * stepY, item }));
        const mIndexById = new Map(mainline.map((it, i) => [it.id, i]));

        // Attach each dead-end to the mainline point immediately before it in time,
        // stacking multiple dead-ends off the same point so they don't overlap.
        const branchesByMain = new Map();
        deadends.forEach(de => {
          const combinedIdx = combined.indexOf(de);
          let anchorItem = null;
          for (let j = combinedIdx - 1; j >= 0; j--) {
            if (mIndexById.has(combined[j].id)) { anchorItem = combined[j]; break; }
          }
          if (!anchorItem) anchorItem = mainline[0];
          const key = anchorItem.id;
          if (!branchesByMain.has(key)) branchesByMain.set(key, []);
          branchesByMain.get(key).push(de);
        });

        const bpts = [];
        mpts.forEach(mp => {
          const list = branchesByMain.get(mp.item.id) || [];
          list.forEach((de, bi) => {
            bpts.push({
              x: centerX + branchOffset,
              y: mp.y + branchStepY * (1 + bi),
              item: de,
              from: mp
            });
          });
        });

        // Extra vertical room so stacked dead-end branches never collide with the
        // next mainline node below them.
        let maxBranchY = 0;
        bpts.forEach(bp => { maxBranchY = Math.max(maxBranchY, bp.y); });
        const mainlineH = (mainline.length - 1) * stepY + padY * 2;
        const H = Math.max(280, mainlineH, maxBranchY + padY);
        svg.setAttribute('width', totalW);
        svg.setAttribute('height', H);
        svg.setAttribute('viewBox', `0 0 ${totalW} ${H}`);
        svg.style.minWidth = '0';

        const svgns = 'http://www.w3.org/2000/svg';
        const group = document.createElementNS(svgns, 'g');
        svg.appendChild(group);
        svg = group;

        // Main spine — one straight line, top to bottom.
        if (mpts.length > 1) {
          let pathD = `M ${mpts[0].x},${mpts[0].y}`;
          for (let i = 1; i < mpts.length; i++) pathD += ` L ${mpts[i].x},${mpts[i].y}`;
          const road = document.createElementNS(svgns, 'path');
          road.setAttribute('d', pathD);
          road.setAttribute('class', 'roadmap-road-path');
          svg.appendChild(road);
          const dash = document.createElementNS(svgns, 'path');
          dash.setAttribute('d', pathD);
          dash.setAttribute('class', 'roadmap-road-dash');
          svg.appendChild(dash);
        }

        // "+" affordance at the midpoint of each mainline segment — click to insert a node there.
        for (let i = 1; i < mpts.length; i++) {
          const p0 = mpts[i - 1], p1 = mpts[i];
          const bx = centerX, by = (p0.y + p1.y) / 2;
          const g = document.createElementNS(svgns, 'g');
          g.setAttribute('class', 'roadmap-add-marker');
          g.setAttribute('tabindex', '0');
          g.setAttribute('aria-label', 'Add roadmap node here');
          const c = document.createElementNS(svgns, 'circle');
          c.setAttribute('cx', bx); c.setAttribute('cy', by); c.setAttribute('r', 9);
          g.appendChild(c);
          const plus = document.createElementNS(svgns, 'text');
          plus.setAttribute('x', bx); plus.setAttribute('y', by + 3.5);
          plus.textContent = '+';
          g.appendChild(plus);
          const prevDate = p0.item.event_date || p0.item.date;
          const nextDate = p1.item.event_date || p1.item.date;
          let prefillDate = null;
          if (prevDate && nextDate) {
            const midMs = (new Date(prevDate).getTime() + new Date(nextDate).getTime()) / 2;
            if (!isNaN(midMs)) prefillDate = new Date(midMs).toISOString().slice(0, 10);
          } else {
            prefillDate = prevDate || nextDate || null;
          }
          g.addEventListener('click', () => openRoadmapAddForm(prefillDate));
          svg.appendChild(g);
        }

        // Dead-end branch stubs — leave the spine, hit an X, stop.
        bpts.forEach(bp => {
          const branchD = `M ${bp.from.x},${bp.from.y} L ${bp.x},${bp.from.y} L ${bp.x},${bp.y}`;
          const stub = document.createElementNS(svgns, 'path');
          stub.setAttribute('d', branchD);
          stub.setAttribute('class', 'roadmap-deadend-path');
          svg.appendChild(stub);
        });

        function drawCard(p, side, typeInfo) {
          const cardH = 54;
          let labelOnLeft = side < 0;
          const edgeMargin = 6;
          if (labelOnLeft && p.x - nodeR - cardGap - cardW < edgeMargin) labelOnLeft = false;
          else if (!labelOnLeft && p.x + nodeR + cardGap + cardW > totalW - edgeMargin) labelOnLeft = true;
          const fo = document.createElementNS(svgns, 'foreignObject');
          fo.setAttribute('x', labelOnLeft ? p.x - nodeR - cardGap - cardW : p.x + nodeR + cardGap);
          fo.setAttribute('y', p.y - cardH / 2);
          fo.setAttribute('width', cardW);
          fo.setAttribute('height', cardH);
          const card = document.createElement('div');
          card.setAttribute('class', 'roadmap-node-card');
          card.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
          const titleText = p.item.node_title || p.item.title || '(untitled)';
          card.innerHTML = `
            <div class="roadmap-node-card-title">${escapeHtml(titleText)}</div>
            ${typeInfo ? `<div class="roadmap-node-card-type">${typeInfo.icon} ${escapeHtml(typeInfo.label)}</div>` : ''}
            <div class="roadmap-node-card-hint">Click for details</div>
          `;
          card.addEventListener('click', () => openRoadmapPanel(p.item.id));
          fo.appendChild(card);
          svg.appendChild(fo);
        }

        function drawNode(p, r, colorCls, isAnchor) {
          const circle = document.createElementNS(svgns, 'circle');
          circle.setAttribute('cx', p.x);
          circle.setAttribute('cy', p.y);
          circle.setAttribute('r', r);
          const activeCls = (isAnchor ? roadmapActiveAnchorKey === p.item.key : p.item.id === roadmapActiveId) ? ' is-active' : '';
          circle.setAttribute('class', 'roadmap-node ' + colorCls + activeCls + (isAnchor && p.item.key === 'end' ? ' is-now' : '') + ' is-static');
          circle.setAttribute('data-id', isAnchor ? p.item.key : p.item.id);
          circle.setAttribute('aria-label', p.item.node_title || p.item.title);
          circle.style.cursor = 'default';
          svg.appendChild(circle);
          return circle;
        }

        // Mainline nodes (start/now anchors + milestone/finding/tuning/decision-linked).
        mpts.forEach((p, i) => {
          const isAnchor = !!p.item.anchor;
          const typeInfo = !isAnchor ? (ROADMAP_NODE_TYPES[p.item.node_type] || null) : null;

          if (isAnchor) {
            const halo = document.createElementNS(svgns, 'circle');
            halo.setAttribute('cx', p.x); halo.setAttribute('cy', p.y); halo.setAttribute('r', p.item.key === 'end' ? 25 : 22);
            halo.setAttribute('class', 'roadmap-anchor-halo');
            svg.appendChild(halo);
          }

          const colorCls = isAnchor ? 'roadmap-node-anchor' : (typeInfo ? typeInfo.cls : 'roadmap-node-c1');
          drawNode(p, isAnchor ? 16 : 13, colorCls, isAnchor);

          const iconG = isAnchor ? buildRoadmapAnchorIcon(svgns, p.item.key) : buildRoadmapTypeIcon(svgns, p.item.node_type);
          const scale = isAnchor ? 0.62 : 0.5;
          iconG.setAttribute('transform', `translate(${p.x},${p.y}) scale(${scale}) translate(-12,-12)`);
          iconG.style.pointerEvents = 'none';
          svg.appendChild(iconG);

          if (isAnchor) {
            const label = document.createElementNS(svgns, 'text');
            label.setAttribute('x', p.x);
            label.setAttribute('y', p.y - 28);
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('class', 'roadmap-node-label is-anchor');
            label.textContent = p.item.title.toUpperCase();
            svg.appendChild(label);

            const caption = document.createElementNS(svgns, 'text');
            caption.setAttribute('x', p.x);
            caption.setAttribute('y', p.y + 34);
            caption.setAttribute('class', 'roadmap-anchor-caption');
            caption.textContent = p.item.key === 'start' ? 'WHERE WE BEGAN' : 'WHERE WE ARE NOW';
            svg.appendChild(caption);
          } else {
            drawCard(p, -1, typeInfo);
          }
        });

        // Dead-end branch nodes.
        bpts.forEach(bp => {
          drawNode(bp, 10, 'roadmap-node-c4', false);
          const iconG = buildRoadmapTypeIcon(svgns, 'dead-end');
          iconG.setAttribute('transform', `translate(${bp.x},${bp.y}) scale(0.4) translate(-12,-12)`);
          iconG.style.pointerEvents = 'none';
          svg.appendChild(iconG);
          drawCard(bp, 1, ROADMAP_NODE_TYPES['dead-end']);
        });
      }

    ${typeInfo ? `<div class="roadmap-tooltip-choice">${typeInfo.icon} ${escapeHtml(typeInfo.label)}</div>` : ''}

    <div class="roadmap-tooltip-hint">Click for details</div>
  `;

document.getElementById('roadmap-item-save-btn').addEventListener('click', async () => {
  const nodeTitle = document.getElementById('roadmap-item-nodetitle-input').value.trim();
  if(!nodeTitle){ showError('Give this roadmap entry a title.'); return; }
  const payload = {
    title: nodeTitle,
    node_title: nodeTitle,
    node_type: document.getElementById('roadmap-item-nodetype-input').value || null,
    what_happened: document.getElementById('roadmap-item-whathappened-input').value.trim() || null,
    result_evidence: document.getElementById('roadmap-item-result-input').value.trim() || null,
    linked_decision_id: multiLinkField('roadmap-item-link-decision-input').scalar,
    linked_decision_ids: multiLinkField('roadmap-item-link-decision-input').ids,
    linked_session_id: multiLinkField('roadmap-item-link-session-input').scalar,
    linked_session_ids: multiLinkField('roadmap-item-link-session-input').ids,
    linked_paper_id: multiLinkField('roadmap-item-link-paper-input').scalar,
    linked_paper_ids: multiLinkField('roadmap-item-link-paper-input').ids,
    event_date: document.getElementById('roadmap-item-date-input').value || todayStr(),
    status: document.getElementById('roadmap-item-status-input').value || 'done'
  };

  if(roadmapAddMode){
    const { data, error } = await supabaseClient.from('roadmap_items').insert(payload).select();
    if(error){ showError('Could not add: ' + error.message); return; }
    roadmapAddMode = false;
    await loadRoadmap();
    if(data && data[0]) openRoadmapPanel(data[0].id);
  } else {
    if(!roadmapActiveId) return;
    const savedId = roadmapActiveId;
    const { error } = await supabaseClient.from('roadmap_items').update(payload).eq('id', savedId);
    if(error){ showError('Could not save: ' + error.message); return; }
    await loadRoadmap();
    openRoadmapPanel(savedId);
  }
});

        const scopeSlug = recapScopeState.scope;

      function buildSummarizePrompt(text, scopeLabel) {
        const contextBlock = projectContext.trim()
          ? `\n--- PROJECT CONTEXT (background, not the log itself) ---\n${projectContext.trim()}\n--- END PROJECT CONTEXT ---\n`
          : '';
        return `You are helping a graduate researcher recap their own research log. Below is a raw, already-distilled log covering: "${scopeLabel}".
${contextBlock}
Use the project context above (if present) to understand the actual research goal, terminology, dataset names, and milestone meanings — don't treat log entries as generic bullet points, interpret them against that background. Write a clear, well-organized narrative recap in plain prose — 2-3 short paragraphs MAXIMUM, aim for under 150 words total. Do not pad or over-elaborate. Group related work together, call out any milestones or key decisions explicitly, and note any open questions or next steps at the end in one line. Do not invent facts, numbers, or results that are not present in the log below. If the log is sparse, keep the recap even shorter rather than padding it.

--- LOG START ---
${text}
--- LOG END ---

Recap:`;
      }

      async function summarizeWithOllama(text, scopeLabel) {
        const prompt = buildSummarizePrompt(text, scopeLabel);
        let model = 'llama3.1';
        try { model = localStorage.getItem('fieldlog-ollama-model') || 'llama3.1'; } catch (e) { }
        let res;
        try {
          res = await fetch('http://localhost:11434/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model, prompt, stream: false })
          });
        } catch (err) {
          throw new Error('Could not reach Ollama at localhost:11434. Checklist: (1) ollama serve is running with OLLAMA_ORIGINS including this site, (2) Chrome may need you to grant "Local network access" for this site — check the site info icon (🔒/ⓘ) next to the URL bar, or chrome://settings/content/localNetworkAccess.');
        }
        if (!res.ok) throw new Error('Ollama returned an error (HTTP ' + res.status + ')');
        const data = await res.json();
        if (!data.response) throw new Error(`Ollama returned no text for model "${model}" — check it matches what you pulled (ollama list)`);
        return data.response;
      }

      document.getElementById('recap-ai-btn').addEventListener('click', async () => {
        const btn = document.getElementById('recap-ai-btn');
        const panel = document.getElementById('recap-ai-panel');
        const body = document.getElementById('recap-ai-body');
        const actions = document.getElementById('recap-ai-actions');

        const text = buildRecapText(false);
        const scopeLabel = recapScopeLabel();

        panel.style.display = 'block';
        actions.style.display = 'none';
        body.innerHTML = `<div class="recap-ai-loading">Summarizing via local Ollama…</div>`;
        btn.disabled = true;

        try {
          const summary = await summarizeWithOllama(text, scopeLabel);
          body.innerHTML = `<div class="recap-ai-text">${escapeHtml(summary).replace(/\n/g, '<br>')}</div>`;
          actions.style.display = 'flex';
        } catch (err) {
          body.innerHTML = `<div class="recap-ai-error">Could not generate a summary: ${escapeHtml(err.message)}</div>`;
        }
        btn.disabled = false;
      });
